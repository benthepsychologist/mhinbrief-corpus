  notes: 'THIS RECORD EXISTS TO STATE AN ABSENCE, AND THE ABSENCE IS THE FINDING. It is recorded
    at confidence: high because it was verified by direct reading of BOTH instruments, not inferred:
    the full text of PHIA was searched for residency, cross-border storage and server-location language
    (the only hits are s. 44, a DISCLOSURE rule, and one reference to another jurisdiction''s prescription-monitoring
    programme), and the Personal Health Information Regulations were read at s. 10, the provision
    PHIA s. 65 delegates electronic-system safeguards to — which prescribes three technical safeguards
    and says nothing about location. A future session should not re-open this as an unknown. regulatory_model
    is ''none'' because no provincial instrument restricts where the data may sit. DISCLOSURE IS
    NOT RESIDENCY — do not let s. 44 be rendered as a residency rule. s. 44 governs whether a custodian
    may DISCLOSE information to someone outside the province (consent, statutory permission, prescription-monitoring,
    inter-governmental health-system administration). Hosting your own records on a server in Virginia
    is not a disclosure to a person outside the province, and s. 44 does not reach it. THE ONE REAL
    CANADIAN-SERVER RULE IN NOVA SCOTIA IS A COLLEGE POLICY, NOT A LAW, AND IT BINDS ONE PROFESSION.
    NSCCT''s Interjurisdictional Telecounselling policy requires PIPEDA-compliant platforms with
    servers in Canada. The practical consequence is worth stating plainly on any page: in Nova Scotia,
    a counselling therapist using a US-hosted video or records platform is offside their College
    even though the province''s privacy statute is silent, while a psychologist or social worker
    doing exactly the same thing is not breaching any located NS requirement. Do not generalise NSCCT''s
    rule across the province. DIVERGES FROM ONTARIO (ca-on-privacy-data-residency), which does have
    a residency-relevant provision. A national page must not present a single Canadian answer here.'
