  clinician_facing_obligations: 'Retain individual client service records for at least
    10 years after the service recipient turns 18, or after the last professional
    contact — whichever comes later. Organizational service records: at least 10 years
    after the organizational client''s last contact. Registrants who are health information
    custodians must also arrange for the security and maintenance of records in case
    of expected or unexpected incapacity or death, and inform the College of those
    arrangements before ceasing to provide services.'
