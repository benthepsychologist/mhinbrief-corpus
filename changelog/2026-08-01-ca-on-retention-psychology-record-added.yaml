  notes: 'INSTRUMENT TYPE — do not blur this on a page: the retention period is set
    by a COLLEGE STANDARD OF PRACTICE (college-enforceable), not by a statute or regulation.
    PHIPA is the only true statute in the stack here and it is silent on duration.
    Breaching the Standard is professional misconduct under O. Reg. 195/23, which
    is where the binding force comes from — the number itself is in the Standard.
    CLOCK START: ''last professional contact''. Compare CRPO (''last interaction'')
    and OCSWSSW (''last entry'') — the three colleges word the trigger differently
    and a record should not flatten them into one phrase. PHIPA INTERACTION, and none
    of the three colleges'' own pages mention it: PHIPA sets NO retention period.
    s. 13(1) requires only that records be "retained, transferred and disposed of
    in a secure manner", and O. Reg. 329/04 adds no number either — the duration comes
    entirely from the college standard. But PHIPA s. 13(2) can EXTEND retention past
    the college clock: where records are subject to a s. 53 access request, the custodian
    must retain them "for as long as necessary to allow the individual to exhaust
    any recourse under this Act". A practitioner destroying at the 10-year mark while
    an access request is live would satisfy the college and breach the Act. TIME-SENSITIVE:
    the Standard''s Practical Applications were updated 2026-05-05, very recently
    — re-verify before any page asserts this is current.'
