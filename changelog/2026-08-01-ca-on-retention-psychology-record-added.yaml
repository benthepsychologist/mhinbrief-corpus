  last_verified: '2026-07-31'
  source_quote: '"9.4 Record Storage and Retention — Individual Client Service records
    must be retained for a minimum of 10 years after the service recipient reaches
    the age of 18 or after the last professional contact, whichever comes later; Unless
    otherwise required by law, organizational service records must be maintained for
    at least ten years following the organizational client''s last contact." — CPBAO,
    Standards of Professional Conduct, s. 9.4 (in force 2024-07-01)'
