  clinician_facing_obligations: Keep a file for each client at the place of practice, and keep each
    file for AT LEAST 5 YEARS from the date of the last professional service provided (a. 8). Files
    may be kept electronically provided confidentiality is assured (a. 2). Files must be stored in
    furniture not freely accessible to the public and kept locked (a. 7). After the retention period
    a file may be destroyed provided confidentiality of its contents is assured (a. 9). Where a client
    asks that a copy of the file or information in it be sent to a THIRD PARTY, the psychologist
    may transmit it only 15 DAYS after the client signs the consent, and the client may revoke consent
    within that window — though in urgent cases the client may waive the 15-day delay (a. 10). A
    note of any such transmission, signed and dated by the client, goes in the file. A psychologist
    practising in a public health or social services établissement is treated as holding the institution's
    user file, and articles 8 to 10 do NOT apply to them (a. 12). The psychologist must display in
    the waiting room a copy of the Code de déontologie, this regulation, and (where fees are charged
    to clients) the conciliation and arbitration regulation, each marked with the Ordre's address
    (a. 18). Where the work environment obstructs compliance, the psychologist must inform the employer
    in writing and notify the Ordre (a. 21).
