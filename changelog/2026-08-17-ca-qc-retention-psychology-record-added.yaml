  notes: 'FIVE YEARS IS THE SHORTEST RETENTION FLOOR IN THIS CORPUS AND IT IS HALF OF ONTARIO''S
    AND NOVA SCOTIA''S FOR THE SAME PROFESSION. Ontario (CPBAO) and Nova Scotia (NSRP) both set 10
    years for psychologists; Nova Scotia''s other two professions sit at 7. Quebec sets 5. A national
    page that states a single Canadian retention period would be wrong everywhere, and wrong by a
    factor of two for a Quebec psychologist. CLOCK START: ''la date du dernier service professionnel
    dispensé'' — the date of the last professional service PROVIDED. This is an act-based trigger
    like Nova Scotia counselling therapy''s ''last date of service'', and unlike the entry-based
    trigger OCSWSSW and NSCSW use (''last entry''), which a late-written note can move. NO SPECIAL
    RULE FOR MINORS — and this is a real divergence worth stating plainly. Ontario and both Nova
    Scotia professions extend retention for clients who were minors (typically to some years past
    the 18th birthday). RLRQ c. C-26, r. 221 contains no equivalent: the 5-year clock runs from the
    last service regardless of the client''s age. Do not import the age-of-majority extension into
    Quebec by analogy. INSTRUMENT TYPE — THE OPPOSITE SHAPE FROM THE COMMON-LAW PROVINCES: this period
    is set by a GOVERNMENT REGULATION made under the Code des professions, not by a college-authored
    standard of practice. That is why Quebec''s psychologists and social workers share the same 5-year
    rule while Ontario''s and Nova Scotia''s professions diverge from each other. THE INSTITUTIONAL
    CARVE-OUT AT a. 12 IS LARGE AND EASY TO MISS: a psychologist employed in a public établissement
    is outside articles 8 to 10 entirely — retention, destruction and the 15-day third-party transmission
    rule are the institution''s regime, not theirs. The 5-year rule is effectively a PRIVATE-PRACTICE
    rule. THE 15-DAY COOLING-OFF PERIOD AT a. 10 HAS NO ANALOGUE ELSEWHERE IN THIS CORPUS and is
    operationally significant: a Quebec psychologist who forwards a file to a lawyer or insurer the
    day consent is signed has breached the regulation, urgency aside.'
