  clinician_facing_obligations: Retain both individual and corporate client records for at least
    10 years following the last client contact. Where the client was under 18 at the time of last
    contact, retain the individual client record for 10 years following the client's 18th birthday.
    Billing records are retained on the same basis (s. 7.5). In private practice, a registrant who
    plans to or ceases to provide services must take responsibility for maintenance and security
    of records or arrange for another registrant to do so, and must inform NSRP of those arrangements
    at the earliest reasonable opportunity; advance arrangements should also be made for incapacity
    or death (s. 7.7). In an employment setting, the registrant must make reasonable efforts to ensure
    a policy exists covering records on their departure (s. 7.8).
  vendor_facing_obligations: null
