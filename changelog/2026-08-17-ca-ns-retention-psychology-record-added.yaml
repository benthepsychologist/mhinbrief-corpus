  last_verified: '2026-08-17'
  source_quote: '"7.4 Unless otherwise required by law a registrant shall retain both individual
    and corporate client records for at least ten years following the last client contact. If an
    individual client was less than eighteen years of age at the time of last contact, the individual
    client record shall be retained for ten years following the date of the client''s eighteenth
    birthday. In the case of ongoing service to a corporate client, information more than ten years
    old may be destroyed if it is not relevant to current services." — NSRP Standards of Professional
    Conduct, s. 7.4'
