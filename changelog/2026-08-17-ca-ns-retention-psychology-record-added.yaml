  notes: 'INSTRUMENT TYPE — do not blur this: the 10-year period is set by a COLLEGE STANDARD OF
    PRACTICE, not by statute or regulation. The Psychology Regulations (N.S. Reg. 252/2025) contain
    NO record-keeping or retention provision at all, and PHIA sets no period either (see ca-ns-privacy-phia)
    — it requires only that a custodian HAVE a written retention schedule. The number comes entirely
    from the Standard. CLOCK START: ''last client contact''. This is a FOURTH distinct trigger wording
    in this corpus — compare CPBAO ''last professional contact'', CRPO ''last interaction'', OCSWSSW
    ''last entry'', and NS social work''s own ''last entry''. Do not flatten these into one phrase
    on any page; the difference decides real destruction dates. WITHIN NOVA SCOTIA THE THREE PROFESSIONS
    DIVERGE: psychology 10 years / last client contact; counselling therapy 7 years / last date of
    service; social work 7 years / last entry. A page that says ''Nova Scotia requires X years''
    without naming the profession is wrong for two of the three. AGE OF THE INSTRUMENT — FLAG FOR
    RE-VERIFICATION: the Standards of Professional Conduct carry an effective date of 19 February
    2007 and sit in a binder compiled around 2010. They therefore PRE-DATE by roughly 18 years the
    RHPA transition (2025-11-24) that now governs the profession. NSRP has not visibly reissued them
    against the new statute. This is not a reason to doubt the 10-year number, but it is a reason
    to re-check before any page asserts the Standards are current under the RHPA.'
