  notes: 'THIS IS A BINDING STANDARD, and that distinguishes it sharply from NS psychology, where
    the equivalent document is an advisory with no force (see ca-ns-telepractice-psychology). Within
    one province, a social worker delivering virtual care has enumerated enforceable obligations
    while a psychologist doing the identical work has only advice. THE JURISDICTIONAL TEST HERE CONFLICTS
    WITH NSCCT''S — worth surfacing on any comparison page. NSCSW s. 6.5.3 requires compliance with
    the law where the social worker is regulated, where they practise, AND where the service user
    resides — a cumulative, client-inclusive test. NSCCT''s Interjurisdictional Telecounselling policy
    takes the opposite position, that practice occurs where the therapist is registered. Two Nova
    Scotia regulators, two incompatible answers to the same cross-border question. NO DATA-RESIDENCY
    REQUIREMENT HERE, unlike NSCCT, which mandates PIPEDA compliance and Canadian-hosted servers.
    NSCSW requires safeguards (encryption, passwords, firewalls) but does not say where data may
    live. PHIA does not fill that gap either. 6.5.8 IS UNUSUALLY PRESCRIPTIVE about client-side conduct
    — telling service users to be alone in a private area and not use their phone during a session
    is a documented informing duty, not merely good practice. RECENTLY EFFECTIVE: 2026-02-01. Verify
    numbering against the current PDF before citing section numbers on a page.'
