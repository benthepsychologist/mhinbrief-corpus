  clinician_facing_obligations: Hold a permit from the Ordre des psychologues du Québec (OPQ) and
    be entered on its roll (tableau) to use the reserved title of psychologist. The permit opens
    on a DOCTORATE in psychology — Ph.D. (recherche et intervention) or D.Psy. — from a designated
    Quebec university, listed exhaustively at s. 1.24 of the diploma regulation. Quebec has required
    a doctorate for the psychologist permit since 2006; a master's degree no longer opens the permit.
    Candidates holding a diploma from outside Quebec proceed by equivalence through the OPQ's admissions
    process. Practice is also subject to the Code des professions, the Code de déontologie des psychologues
    (RLRQ c. C-26, r. 212), and the record-keeping regulation (RLRQ c. C-26, r. 221).
