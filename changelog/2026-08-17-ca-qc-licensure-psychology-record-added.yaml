  notes: 'QUEBEC IS THE ONLY JURISDICTION IN THIS CORPUS WHERE THE PSYCHOLOGIST PERMIT REQUIRES A
    DOCTORATE OUTRIGHT. Ontario (CPBAO) and Nova Scotia (NSRP) both admit master''s-level routes
    — NSRP''s own baseline is a master''s degree with four years of supervised experience. A master''s-prepared
    psychologist registered in ON or NS does not meet Quebec''s entry standard, which matters for
    anyone reasoning about labour mobility or cross-border telepractice into Quebec. THE STRUCTURE
    IS DIFFERENT FROM THE COMMON-LAW PROVINCES AND SHOULD NOT BE DESCRIBED IN THEIR VOCABULARY: Quebec
    regulates through the Code des professions, a single framework statute governing all 46 ordres,
    with the operative rules in GOVERNMENT REGULATIONS made under it rather than in college-authored
    standards. There is no ''college standard of practice'' layer of the kind that carries the retention
    and insurance numbers in Ontario and Nova Scotia. That is why Quebec''s rules are uniform across
    professions where the other provinces'' diverge — see ca-qc-retention-psychology. THE DIPLOMA
    LIST IS EXHAUSTIVE AND NAMED university by university; it is amended by regulation when a programme
    is added, so a new Quebec doctorate does not automatically open the permit. Re-verify the list
    before asserting any specific programme qualifies.'
