  clinician_facing_obligations: 'Ensure each service user record is stored and preserved in a secure
    location for at least 7 years from the date of the LAST ENTRY. Where the service user was under
    18 at the date of the last entry, retain for at least 7 years from the day they became or would
    have become 18. Longer periods may be required by law or by employer or self-employed-member
    policy, and such policies should be developed with a view to the potential future need for the
    record. Separately: store records securely and prevent unauthorised access (s. 6.2.11); transfer
    or dispose of records in a way that protects confidentiality and complies with applicable legislation
    (s. 6.2.12); take reasonable precautions to protect confidential information on termination of
    practice, incapacity, or death (s. 6.2.13); and comply with retention, storage, preservation
    and security requirements in applicable privacy and other legislation, including a thorough understanding
    of an employing organisation''s policies (s. 6.2.14).'
