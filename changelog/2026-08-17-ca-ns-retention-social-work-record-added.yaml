  source_quote: '"6.2.15 ensuring that each service user record is stored and preserved in a secure
    location for at least seven years from the date of the last entry or, if the service user was
    less than eighteen years of age at the date of the last entry, at least seven years from the
    day the service user became or would have become eighteen. Different periods of storage time
    may be required by law." — NSCSW Code of Ethics and Standards of Practice, s. 6.2.15 (effective
    2026-02-01)'
  source_url_secondary:
  - https://nscsw.org/standards/
  confidence: high
  notes: 'CLOCK START: ''last entry'' — the same trigger wording OCSWSSW uses in Ontario, and DIFFERENT
    from both other Nova Scotia professions (psychology ''last client contact'', counselling therapy
    ''last date of service''). ''Last entry'' is the most clinician-controllable of the three: a
    late note written months after the final session moves the destruction date, where ''last contact''
    and ''last date of service'' do not. PERIOD DIFFERS FROM NS PSYCHOLOGY BY THREE YEARS — 7 here,
    10 there — in the same province, for clinicians who often work side by side in the same setting.
    INSTRUMENT TYPE: college Standard of Practice, made under the Social Workers Act, NOT the RHPA
    (see ca-ns-licensure-social-work — social work''s RHPA migration is not complete). PHIA sets
    no period of its own; it requires only a written retention schedule (see ca-ns-privacy-phia),
    so this 7-year figure is the operative number for NS social workers. RECENTLY EFFECTIVE — VERIFY
    BEFORE RELYING: this Code came into effect 2026-02-01, roughly six months before this record
    was written, replacing the prior version. Anything published about NS social work retention before
    February 2026 may cite superseded numbering or a different period.'
