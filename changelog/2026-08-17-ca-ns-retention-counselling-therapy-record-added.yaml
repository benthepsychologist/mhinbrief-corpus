  clinician_facing_obligations: Ensure the security and preservation of client records for which
    the counsellor/therapist has maintenance responsibility, and the records of those they supervise,
    for the period stipulated by law in the jurisdiction and by employer protocol, whichever is LONGEST.
    CCPA's own standard is 7 years after the last date of service provided, and 7 years after the
    age of majority for children, where the legal and employment stipulations are shorter. Arrange
    for secure preservation and disposition of records on retirement, death, or other departure;
    in private practice records may be transferred to another counsellor/therapist with clients notified,
    or clients may take possession. Never destroy records or notes after receiving a subpoena or
    having reason to expect one — this may be treated as obstruction of justice or contempt of court.
  vendor_facing_obligations: null
  consent_required: false
  documentation_required: true
  source_url: https://nscct.ca/wp-content/uploads/2023/08/CCPA-Standards-of-Practice-ENG-Sept-29-Web-file.pdf
  last_verified: '2026-08-17'
  source_quote: '"Counsellors/therapists shall ensure the security and preservation of client records
    for which they have maintenance responsibility, and the records of those they supervise, for
    a period stipulated by law in their jurisdiction and by protocol of their employer, whichever
    is longest. CCPA''s standard of practice is to retain records for a period of seven years after
    the last date of service provided, and for seven years after the age of majority for children
    when the stipulation in law and by employment protocol is shorter than this length of time."
    — CCPA, Standards of Practice (6th ed.)'
