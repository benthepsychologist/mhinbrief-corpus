  notes: 'CONFIDENCE IS MEDIUM AND THE REASON IS STRUCTURAL, NOT EVIDENTIARY. The quote is verbatim
    from a primary document read directly. What is less than certain is its BINDING FORCE in Nova
    Scotia: NSCCT does not author its own standards of practice or code of ethics — it adopts the
    CCPA (Canadian Counselling and Psychotherapy Association) documents, a national VOLUNTARY ASSOCIATION''s
    instruments, and lists them on its Standards Documents page. The Counselling Therapists Regulations
    do not themselves incorporate them by reference in any provision found in this pass. Before publishing
    this as a hard Nova Scotia requirement, confirm the adopting instrument — a bylaw, a Board resolution,
    or a regulation provision naming the CCPA documents. That is a specific, answerable question
    for the NSCCT practice advisor and is the single thing standing between this record and confidence:
    high. A REAL TRAP IN THE REGULATION, WORTH STATING SO NOBODY REPEATS IT: N.S. Reg. 287/2011 s.
    42 does contain a 5-year preservation rule — but it governs EVIDENCE BEFORE THE PROFESSIONAL
    CONDUCT COMMITTEE, not client records. It would be an easy and serious misreading to publish
    ''Nova Scotia counselling therapists must keep records 5 years'' on the strength of it. The client-record
    period is 7 years, and it comes from the CCPA Standards. CLOCK START: ''last date of service
    provided'' — a third distinct wording alongside NS psychology''s ''last client contact'' and
    NS social work''s ''last entry''. THE ''WHICHEVER IS LONGEST'' RULE IS THE OPERATIVE ONE for
    anyone employed: where PHIA, an employer''s schedule, or another enactment demands longer, that
    longer period governs.'
