  clinician_facing_obligations: 'An Ontario private-practice behavioural-health clinician
    is a health information custodian (HIC) under PHIPA, and therefore carries the
    Act''s full duties — not PIPEDA, which is displaced for activity within Ontario.
    But the ROUTE into custodian status differs by profession, and the difference
    matters: psychologists and Registered Psychotherapists qualify under the ''health
    care practitioner'' definition at s. 2(a), by virtue of being members of a college
    under the Regulated Health Professions Act, 1991. Clinical social workers qualify
    under a SEPARATE paragraph, s. 2(c), which exists precisely because OCSWSSW is
    not an RHPA college. A practitioner using an unregulated title is captured only
    by the residual clause s. 2(d) — ''any other person whose primary function is
    to provide health care for payment'' — which turns on facts about their practice
    rather than a college registry check, and is a materially weaker footing.'
  vendor_facing_obligations: null
