  last_verified: '2026-07-31'
  source_quote: '"''health care practitioner'' means, (a) a person who is a member
    within the meaning of the Regulated Health Professions Act, 1991 and who provides
    health care, (b) Repealed, (c) a person who is a member of the Ontario College
    of Social Workers and Social Service Workers and who provides health care, or
    (d) any other person whose primary function is to provide health care for payment;"
    — PHIPA, S.O. 2004, c. 3, Sched. A, s. 2 (e-Laws consolidation, currency date
    2026-07-28)'
  source_url_secondary: []
  confidence: high
  notes: 'THE DISTINCTION IS THE PRODUCT HERE: all four professions land on HIC status,
    but by three different statutory routes (s.2(a) RHPA membership / s.2(c) OCSWSSW
    named separately / s.2(d) residual). Do not flatten this to ''therapists are HICs''.
    Ontario has no regulated title ''counselling therapist'' — the nearest regulated
    analogue is CRPO''s Registered Psychotherapist; an unregulated counsellor relies
    on s.2(d). Every route also passes through the s.2 ''health care'' gate (''diagnose,
    treat or maintain an individual''s physical or mental condition''), which psychotherapy
    plainly satisfies. Statute text verified verbatim from Ontario e-Laws via headless
    browser (the page is JS-rendered and returns only a shell to a plain fetch).'
