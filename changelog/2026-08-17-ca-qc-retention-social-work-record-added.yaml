  notes: 'QUEBEC IS UNIFORM WHERE ONTARIO AND NOVA SCOTIA ARE NOT, AND THAT UNIFORMITY IS THE FINDING.
    Quebec psychologists (RLRQ c. C-26, r. 221, a. 8) and Quebec social workers (here) are both at
    5 years from the last professional service. In Ontario the three colleges diverge on both period
    and trigger wording; in Nova Scotia the three professions sit at 10, 7 and 7 years with three
    different triggers. The reason is structural: Quebec''s retention rules are GOVERNMENT REGULATIONS
    made under one framework statute, drafted to a common template, whereas Ontario''s and Nova Scotia''s
    are authored separately by each college. A page can safely say ''Quebec: 5 years'' without naming
    the profession — and cannot safely say that about any other jurisdiction covered so far. CLOCK
    START: ''la date du dernier service professionnel rendu'' — last professional service RENDERED,
    against the psychologists'' regulation''s ''dispensé'' (provided). The difference is stylistic
    rather than substantive, but quote each regulation''s own word rather than harmonising them.
    NO MINORS EXTENSION, same as Quebec psychology and unlike Ontario and Nova Scotia. SHORTER AND
    SIMPLER THAN THE PSYCHOLOGISTS'' REGULATION: r. 297 a. 6 carries no equivalent of r. 221''s 15-day
    third-party transmission delay or its établissement carve-out. Do not assume the psychology wrinkles
    apply to social work.'
