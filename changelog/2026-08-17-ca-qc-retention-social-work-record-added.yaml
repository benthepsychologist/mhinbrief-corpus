  source_quote: '"6. Le travailleur social doit conserver chaque dossier au moins 5 ans à compter
    de la date du dernier service professionnel rendu. À l''expiration de ce délai, il peut procéder
    à l''élimination d''un dossier en s''assurant de la confidentialité des renseignements qui y
