  confidence: high
  notes: 'TWO-LAYER INSTRUMENT: the DUTY is in a regulation (N.S. Reg. 252/2025 s. 11(1)(a)(iii)),
    but the AMOUNT is not — the regulation says only ''in the form and amount set by the Board''.
    The $1,000,000 figure comes from NSRP''s own regulatory policy and can therefore change without
    any regulatory amendment. Re-verify the figure against the policy document, not the regulation,
    on every pass. CONTRAST WITHIN NOVA SCOTIA — this is the sharpest divergence found in the province:
    psychology requires $1M per occurrence of every registrant; counselling therapy requires $2M
    per claim / $5M aggregate with no deductible AND expressly refuses employer-provided coverage;
    social work requires only ''adequate'' insurance with no stated amount and only for those in
    private practice. A Nova Scotia clinician moving between these professions faces materially different
    obligations. THE CSC EXEMPTION IS NARROW: it evaporates the moment the psychologist practises
    at all outside CSC, for any length of time. The document is explicit that CSC must collect a
    signed, witnessed annual declaration to that effect.'
