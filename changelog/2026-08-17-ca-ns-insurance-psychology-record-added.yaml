  clinician_facing_obligations: 'Hold professional liability insurance (or other malpractice coverage
    or liability protection) in the form and amount set by the Board. The minimum amount set by the
    Board is $1,000,000 per occurrence. Applies to holders of a Practising Licence AND a Candidate
    Psychologist Conditional Licence. Proof of coverage must be provided within 30 days of the licence
    being granted, and maintaining coverage is a condition of annual renewal. Employer-provided coverage
    does not automatically satisfy this — NSRP''s position is that institutional coverage may not
    cover all acts of an employee and that psychologists employed by health institutions, school
    boards and universities still require personal coverage. One standing exemption exists: Correctional
    Service Canada employees practising only within CSC, under a monitored annual-declaration arrangement
    between NSRP and CSC. Other federal employees must submit proof of their own coverage. Retired,
    relocated or career-changed registrants are advised to maintain coverage or obtain extended-reporting
    (''tail'') coverage, because policies are typically written on a claims-made basis.'
