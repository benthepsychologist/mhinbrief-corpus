  notes: 'INSTRUMENT TYPE — do not blur this on a page: the retention period is set
    by a COLLEGE STANDARD OF PRACTICE (college-enforceable), not by a statute or regulation.
    PHIPA is the only true statute in the stack here and it is silent on duration.
    Approved by College Council and implemented by bylaw. Current edition effective
    2023-09-08, superseding the second edition that stood 2008-07-01 to 2023-09-07.
    CLOCK START: ''last entry'' — a materially different trigger from CPBAO''s ''last
    professional contact'' and CRPO''s ''last interaction''; a late administrative
    entry can move an OCSWSSW clock in a way a last-contact clock would not. GAP relative
    to the other two colleges: OCSWSSW''s standard does not name death or incapacity
    specifically — ''cease practice'' (4.2.8-4.2.9) is the operative language and
    covers it, but there is no death-specific provision the way CPBAO 9.6 and CRPO
    6.4.3 have. Stated as a finding, not a defect. PHIPA INTERACTION, and none of
    the three colleges'' own pages mention it: PHIPA sets NO retention period. s.
    13(1) requires only that records be "retained, transferred and disposed of in
    a secure manner", and O. Reg. 329/04 adds no number either — the duration comes
    entirely from the college standard. But PHIPA s. 13(2) can EXTEND retention past
    the college clock: where records are subject to a s. 53 access request, the custodian
    must retain them "for as long as necessary to allow the individual to exhaust
    any recourse under this Act". A practitioner destroying at the 10-year mark while
    an access request is live would satisfy the college and breach the Act.'
