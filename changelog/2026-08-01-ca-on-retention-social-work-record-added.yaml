  source_quote: '"4.2.2 College registrants shall ensure that each client record is
    stored and preserved in a secure location for at least ten years from the date
    of the last entry or, if the client was less than eighteen years of age at the
    date of the last entry, at least ten years from the day the client became or would
    have become eighteen." — OCSWSSW, Code of Ethics and Standards of Practice, Principle
    IV, Interpretation 4.2.2 (effective 2023-09-08)'
