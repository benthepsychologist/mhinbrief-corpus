  clinician_facing_obligations: Store and preserve each client record securely for
    at least 10 years from the date of the LAST ENTRY or, if the client was under
    18 at that date, at least 10 years from the day they turned (or would have turned)
    18. Retain longer where required by law or an employer's policy, and retain longer
    on reasonable judgment where future access may be needed — the Standard names
    minors, sexual abuse, and current or future litigation. Dispose only after the
    period elapses, and in a way that does not compromise confidentiality. On ceasing
    practice, either keep maintaining the records or transfer them to another registrant
    or regulated professional who first agrees in writing to comply with Principle
    IV.
