record_id: ca-qc-telepractice-psychology
field: clinician_facing_obligations
old: 'Quebec has no telepractice-specific REGULATION for psychologists. The OPQ publishes lignes
  directrices and points de repère, and is explicit that it does not impose particular tools or forms
  — ''l''Ordre ne prescrit, ne recommande, ni n''impose l''usage d''un formulaire préconçu''. The
  binding obligations are the ordinary ones — the Code de déontologie, the record-keeping regulation,
  competence — which apply whatever the medium. On INTERJURISDICTIONAL practice the OPQ does state
  operative positions: a psychologist serving a client located outside Quebec must check whether
  the regulator in the client''s jurisdiction requires a permit or legal authorisation there; and
  a person who is PHYSICALLY IN QUEBEC offering services to Quebec clients must register with the
  OPQ, while the OPQ accepts that psychologists located outside Quebec may offer online services
  to Quebec clientele. No data-hosting, platform, or server-location requirement is specified.'
new: 'Quebec sets no telepractice-specific REGULATION for psychologists. The OPQ publishes guidance
  — lignes directrices, points de repère, and a scenario FAQ — and is explicit that it does not impose
  particular tools or forms. The binding obligations are the ordinary ones: the Code de déontologie,
  the record-keeping regulation, and competence, which apply whatever the medium. ON INTERJURISDICTIONAL
  PRACTICE the OPQ''s guidance takes the form of ANSWERS TO SPECIFIC POSED SCENARIOS, and must be
  read as such rather than as a general jurisdictional doctrine. Three of those scenarios matter:
  (1) A Quebec psychologist practising from outside Quebec (e.g. six months in the United States,
  or travelling with a sports team) must remain entered on the OPQ roll as a regular member, must
  check whether the regulator in the jurisdiction WHERE THEY THEMSELVES ARE requires a permit or
  legal authorisation, must maintain the liability coverage required by the Ordre while informing
  the client that the Ordre''s coverage is valid only for claims within Canada, and must tell the
  client the Ordre can still receive and handle a complaint about services delivered remotely. (2)
  Asked about a psychologist or psychotherapist REGISTERED IN ONTARIO who will be in Montreal for
  a few months and wants to keep seeing their ONTARIO clients, the OPQ answers that to offer services
  to clients in Quebec OR remotely to clients outside Quebec, a person who is physically in Quebec
  must register with the OPQ or obtain a special authorisation to practise. Physical presence in
  Quebec therefore triggers the OPQ requirement even where every client is elsewhere. (3) Asked whether
  a psychologist or psychotherapist registered in BRITISH COLUMBIA may serve a person living in Montreal,
  the OPQ answers that a psychologist or psychotherapist located outside Quebec may offer online
  services to clients situated in Quebec. It RECOMMENDS — not requires — that such a person be legally
  authorised to practise the profession in their own jurisdiction; it states they must carry professional
  liability insurance; and it requires that clients be advised that any disciplinary proceeding must
  be brought before the regulatory body in the jurisdiction where the professional is located. CRITICAL
  LIMIT ON ALL OF THE ABOVE: this guidance addresses OPQ REGISTRATION. It does not displace the Code
  des professions, art. 187.1, under which PSYCHOTHERAPY IS A RESERVED ACT in Quebec — reserved to
  physicians, psychologists, and permit-holders who are members of seven named ordres. A person outside
  Quebec who is not within that class does not acquire the right to perform psychotherapy with a
  Quebec client by reading an FAQ about registration, and the OPQ is itself the body that prosecutes
  illegal practice of psychotherapy (art. 187.4.3). No data-hosting, platform, or server-location
  requirement is specified anywhere in this guidance.'
source_url: https://www.ordrepsy.qc.ca/telepratique-distance-detenteurs
observed: '2026-08-17'
status: in-effect
kind: record-corrected
correction_note: Corrected after operator challenge. OPQ scenario-FAQ answers were read as a general
  jurisdictional doctrine, and one quote was truncated in a way that dropped two material clauses.
  The reserved-act limit under Code des professions art. 187.1 was missing and is now stated. The
  underlying law did not change; our reading of it did.
