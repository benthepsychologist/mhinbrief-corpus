  clinician_facing_obligations: Nursing services rendered to an individual within
    a nurse-patient relationship are exempt from GST/HST. This matters to behavioural-health
    practice because where provincial law permits a nurse to provide psychotherapy
    within their scope of nursing practice, CRA treats the nursing exemption at s.
    6 as the applicable provision rather than the psychotherapy exemption added in
    2024 — so the test is the nurse-patient relationship, not the s. 7 practitioner
    definition.
  vendor_facing_obligations: null
