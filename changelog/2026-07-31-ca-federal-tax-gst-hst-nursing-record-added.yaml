  confidence: high
  notes: 'SCOPE CALL, FLAGGED FOR THE OPERATOR RATHER THAN DECIDED SILENTLY: nursing
    is not one of the five professions this registry covers (psychologist, psychotherapist,
    counselling therapist, clinical social worker, MFT), so profession_scope is deliberately
    EMPTY rather than stretched to include a profession the registry does not claim
    to serve. This record exists because it completes the picture of which provision
    governs psychotherapy delivered by whom — CRA points registered psychiatric nurses
    providing psychotherapy at s. 6, not s. 7(j.1) — and a reader comparing routes
    needs it. If the operator would rather the corpus hold only records scoped to
    the five professions, retire this one; it is the clearest candidate for that.

    Statutory text verified verbatim from raw Justice Laws HTML, no summarising tool
    in the extraction path.

    OPEN — enactment_date and effective_date null on purpose, same as the psychology
    and social work records: s. 6 predates the 2024 amendment and its in-force date
    was not traced this pass. Guessing on the enacted/in-force axis is worse than
    leaving it empty (AGENTS.md #4).'
