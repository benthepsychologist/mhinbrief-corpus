  source_url: https://laws-lois.justice.gc.ca/eng/acts/e-15/page-120.html
  last_verified: '2026-07-31'
  source_quote: '"6 A supply of a nursing service rendered to an individual by a registered
    nurse, a registered nursing assistant, a licensed or registered practical nurse
    or a registered psychiatric nurse, if the service is rendered within a nurse-patient
    relationship." — Excise Tax Act, Schedule V, Part II, s. 6 (Justice Laws consolidation,
    Act current to 2026-06-14)'
  source_url_secondary:
