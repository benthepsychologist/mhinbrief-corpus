  clinician_facing_obligations: All licensed registrants, INCLUDING those on leave, must maintain
    professional liability insurance covering all counselling-therapy services within their individual
    scope of practice. Coverage must be not less than $2,000,000 per claim and not less than $5,000,000
    aggregate, WITH NO DEDUCTIBLE. Proof must be submitted at initial application and again at annual
    registration and licence renewal, as a copy of the current policy or a letter from the insurer
    verifying amounts and extent of coverage. Insurance provided through an employer or other third
    party is NOT sufficient to meet this requirement. Registrants providing telecounselling outside
    Nova Scotia bear sole responsibility for ensuring their coverage extends to out-of-province clients.
