  notes: 'THIS IS THE HEAVIEST INSURANCE OBLIGATION IN THE CORPUS SO FAR and the two clauses that
    bite hardest are easy to miss. First, the no-employer-coverage rule (s. 2.0): a counselling therapist
    employed by a health authority, school board or agency must still buy personal coverage — institutional
    coverage does not count, full stop. That is STRICTER than NS psychology, where employer coverage
    can be accepted case-by-case if the employer demonstrates equivalency and agrees to monitor it.
    Second, ''no deductible'' is an unusual and specific term that many standard policies do not
    satisfy; a registrant who has coverage at the right limits but with a deductible is still offside.
    ''INCLUDING THOSE ON LEAVE'' (s. 1.0) is the other trap — the obligation does not pause when
    practice does. TWO-LAYER INSTRUMENT, same shape as NS psychology: the DUTY is statutory/regulatory
    (Counselling Therapists Act s. 12(1)(f); N.S. Reg. 287/2011 s. 7(2)(g) requires coverage ''in
    at least the minimum amount approved by the Board'', waivable by the Registration Committee),
    but the AMOUNTS live only in Board policy and can change without a regulatory amendment. Re-verify
    the figures against the policy PDF, not the regulation. NOTE THE WAIVER: the regulation contemplates
    the Registration Committee waiving the insurance requirement entirely. The policy as written
    does not describe when that happens — an open question if a page ever states the requirement
    as absolute.'
