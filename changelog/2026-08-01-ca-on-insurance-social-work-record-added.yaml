  notes: 'THIS CORRECTS A COMMON BELIEF, and is verified against primary sources rather
    than the College''s own summary alone: O. Reg. 383/00 (Registration) under the
    Social Work and Social Service Work Act, 1998 was fetched in full from Ontario
    e-Laws and contains ZERO substantive mentions of insurance across all 19 sections.
    The College''s Registration Requirements page likewise omits it. MISINFORMATION
    IN CIRCULATION, worth stating on a page: a broker marketing FAQ (PROLINK/OASW,
    2025) asserts that ''the Ontario College of Social Workers and Social Service
    Workers (OCSWSSW) mandates Professional Liability Insurance to practice''. That
    is contradicted by the regulator''s own primary sources. A practitioner reading
    only the insurer''s material would believe insurance is compulsory when it is
    not. Source wins; the broker material is marketing, not primary. TERRITORY of
    the program social workers typically use anyway (OASW/PROLINK): ''Canada-wide'',
    framed around the practitioner travelling while continuing virtual services with
    THEIR ONTARIO-BASED clients — it does not address delivering services TO clients
    based outside Ontario at all. That is an absence, not a stated exclusion. Materially
    narrower than the psychologists'' worldwide telepsychology coverage. OPEN: a search
    snippet suggested the Code of Ethics encourages coverage for registrants providing
    supervision; not verbatim-verified, do not cite.'
