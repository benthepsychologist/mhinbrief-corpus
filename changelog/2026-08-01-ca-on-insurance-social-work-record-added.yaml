  clinician_facing_obligations: NOT MANDATORY. Professional liability insurance is
    not a registration requirement for OCSWSSW registrants. The College strongly encourages
    it but does not require it, and there is no by-law or regulation imposing it.
    A social worker in Ontario private practice may register and practise without
    professional liability insurance.
