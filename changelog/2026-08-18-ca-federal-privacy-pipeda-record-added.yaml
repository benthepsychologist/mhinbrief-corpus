  source_quote: '"4 (1) This Part applies to every organization in respect of personal information
    that (a) the organization collects, uses or discloses in the course of commercial activities"
    ... "26 (2) The Governor in Council may, by order, ... (b) if satisfied that legislation of a
    province that is substantially similar to this Part applies to an organization, a class of organizations,
    an activity or a class of activities, exempt the organization, activity or class from the application
    of this Part in respect of the collection, use or disclosure of personal information that occurs
    within that province" ... "10.3 (1) An organization shall, in accordance with any prescribed
    requirements, keep and maintain a record of every breach of security safeguards involving personal
    information under its control." — Personal Information Protection and Electronic Documents Act,
    S.C. 2000, c. 5. And: "6 (1) For the purposes of subsection 10.3(1) of the Act, an organization
    must maintain a record of every breach of security safeguards for 24 months after the day on
    which the organization determines that the breach has occurred." — Breach of Security Safeguards
    Regulations, SOR/2018-64, s. 6(1). And: "1 Any personal health information custodian to which
    the Personal Health Information Act, SNS 2010, c. 41, of Nova Scotia applies is exempt from the
    application of Part 1 of the Personal Information Protection and Electronic Documents Act in
    respect of the collection, use and disclosure of personal health information that occurs in Nova
    Scotia." — Personal Health Information Custodians in Nova Scotia Exemption Order, SOR/2016-62'
