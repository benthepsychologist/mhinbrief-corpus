  notes: 'THE WHOLE POINT OF THIS RECORD, AND THE THING MOST OFTEN GOT WRONG: BEING IN A PROVINCE
    WITH A ''SUBSTANTIALLY SIMILAR'' LAW DOES NOT PUT A CLINICIAN OUTSIDE PIPEDA. It puts them outside
    PIPEDA for what happens INSIDE the province. The limiting words are in the enabling provision
    itself (s. 26(2)(b): ''that occurs within that province'') and are repeated in the operative
    order for Nova Scotia (SOR/2016-62: ''that occurs in Nova Scotia''), whose regulatory impact
    statement says the goal is to signal that custodians ''would no longer be subject to Part 1 of
    PIPEDA FOR INTRA-PROVINCIAL TRANSACTIONS''. The practical consequence for this corpus''s audience
    is large: a clinician in Ontario, Nova Scotia or Quebec who sees an out-of-province client, or
    whose records or video platform cross a provincial or national boundary, is potentially under
    BOTH the provincial regime and PIPEDA for that flow. A page that says ''PIPEDA doesn''t apply
    in Ontario'' is wrong in exactly the situations telepractice creates. THE TERRITORIES ARE STRAIGHTFORWARDLY
    FEDERAL. The Northwest Territories, Yukon and Nunavut are treated as federally regulated, so
    PIPEDA — not a territorial statute — is the private-sector privacy law there. The corpus''s jurisdiction
    map covers all three; nothing else in the corpus currently says this. s. 10.3(1) IS THE OBLIGATION
    MOST LIKELY TO BE UNKNOWINGLY BREACHED, and it is the federal counterpart of Quebec''s incident
    register. It requires a record of EVERY breach of security safeguards — not merely those meeting
    the reporting threshold — kept 24 months, and s. 28 makes knowingly failing to keep it an offence
    carrying up to $100,000 on indictment. A practice that assessed a minor breach as non-reportable
    and wrote nothing down has satisfied s. 10.1 and contravened s. 10.3(1). THREE DIFFERENT BREACH
    THRESHOLDS NOW SIT IN THIS CORPUS AND MUST NOT BE HARMONISED ON A PAGE: PIPEDA''s ''real risk
    of significant harm'' (s. 10.1(1)); Nova Scotia PHIA''s ''potential for harm or embarrassment''
    (s. 69), which is lower and more subjective; and Quebec Law 25''s ''risque qu''un préjudice sérieux
    soit causé'' (a. 3.5). Their downstream designs differ too — PHIA alone requires telling the
    regulator when you decide NOT to notify (s. 70(2)), while PIPEDA and Law 25 instead require a
    standing register. THE NOVA SCOTIA EXEMPTION IS TIED TO CUSTODIAN STATUS, WHICH RAISES AN UNRESOLVED
    INTERACTION worth flagging rather than answering here. SOR/2016-62 exempts ''any personal health
    information custodian to which the PHIA applies''. Under PHIA s. 6(2) an employed clinician acting
    as an AGENT of a custodian is expressly NOT a custodian (see ca-ns-privacy-custodian-status).
    In practice the employer is the organization engaged in commercial activity, so the question
    is likely academic — but a page should not assert that every Nova Scotia clinician is inside
    the exemption. QUEBEC''S STATUS WAS THE OPEN QUESTION ON THIS CELL AND IS NOW ANSWERED: the OPC''s
    current list still records Quebec''s private-sector law as substantially similar, so the declaration
    survives the Law 25 amendments. Note the MECHANISM differs from Ontario''s and Nova Scotia''s:
    Quebec (like Alberta and BC) is recognised through a general PRIVATE-SECTOR statute, while Ontario,
    Nova Scotia, New Brunswick and Newfoundland and Labrador are recognised through HEALTH-specific
    statutes tied to custodian status. Same effect, different route, and the difference decides who
    is covered. NOT IN FORCE, TRACK IT: 2026, c. 3, ss. 389-397 add a new DIVISION 1.2, MOBILITY
    OF PERSONAL INFORMATION, including s. 10.4 — on an individual''s request an organization must
    disclose personal information it collected from them to another organization the individual designates,
    where both are subject to a data mobility framework — with the framework itself left to regulations
    (ss. 10.5-10.6). The consolidated Act carries these under an express ''AMENDMENTS NOT IN FORCE''
    heading. This is precisely the case schema/record.yaml''s `not_proclaimed` status exists for:
    passed, but it does not bind anyone yet. No data mobility obligation applies today, and none
    will until the framework regulations are made. Re-check on each verify pass — this is the most
    likely federal privacy change to land next. SCOPE LIMIT OF THIS RECORD: it covers PIPEDA as it
    reaches private practice. It does NOT cover the federal Privacy Act (which governs federal government
    institutions), and it does not resolve whether a given publicly funded service is ''commercial
    activity'' — s. 2''s definition turns on commercial character, and a salaried clinician in a
    public system is generally not the organization in question.'
