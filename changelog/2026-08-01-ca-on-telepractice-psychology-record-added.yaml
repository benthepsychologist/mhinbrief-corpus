  clinician_facing_obligations: 'Anyone providing psychological services to a person
    PHYSICALLY IN ONTARIO must be CPBAO-registered — telepsychology included, regardless
    of where the practitioner sits. Practising outside Ontario: the registrant must
    be legally authorised in that jurisdiction, must comply with Ontario''s requirements
    while practising elsewhere, must tell recipients the College can address complaints
    and give College contact information on request, and must carry liability insurance
    covering that service. Where two jurisdictions conflict, comply with whichever
    obligation gives the client greater protection. Cloud services must be hosted
    where security features are consistent with Ontario privacy law, and client identity
    must be verified where visual verification isn''t possible.'
  vendor_facing_obligations: null
  consent_required: false
  documentation_required: false
  source_url: https://cpbao.ca/members/professional-practice/standards-of-professional-conduct/
  last_verified: '2026-07-31'
  source_quote: '"16.2 Adherence to Local Jurisprudence — Registrants must be familiar
    with and adhere to the local jurisprudence and standards for practice in the jurisdiction
    in which the service is being delivered. Where a conflict exists between the requirements
    of two jurisdictions, the registrant must comply with the obligations affording
    greater client protection." — CPBAO, Standards of Professional Conduct, Standard
    16.2 (in force 2024-07-01)'
  source_url_secondary:
