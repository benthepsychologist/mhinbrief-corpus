  confidence: high
  notes: 'STRICTEST OF THE THREE COLLEGES on inbound practice: registration is required
    for ANY client physically in Ontario, no de-minimis exception. Contrast CRPO,
    which does not require registration for an out-of-province therapist serving Ontario
    clients if they don''t advertise here and Ontario clients aren''t a substantial
    share of caseload — a real divergence between two Ontario colleges that a reader
    could easily get wrong. MOBILITY: CPBAO signs ACPRO''s Cross-Jurisdictional Limited
    Telepsychology MOU — time-limited registration (up to 12 months, reduced fee)
    for psychologists licensed elsewhere in Canada, but ONLY within 7 named clinical
    contexts; anything else needs full registration. NUANCE WORTH STATING: Standard
    17.1 requires adherence to ACPRO''s Model Standards for Telepsychology, but that
    document self-describes as ''An Advisory for Psychological Practice'' and said
    it was NOT incorporated into the Standards. The 2024 cross-reference converts
    originally advisory content into mandatory adherence. NO published CPBAO position
    on US clients specifically — Standard 16.2''s general framework would apply.'
