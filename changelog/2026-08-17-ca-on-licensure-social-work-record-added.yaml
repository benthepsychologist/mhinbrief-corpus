  source_quote: '"7. (1) In addition to the requirements set out in sections 4 and 5, the following
    are registration requirements for a general certificate of registration for social work to be
    issued under subsection 18 (1) of the Act: 1. The applicant must produce documentation satisfactory
    to the Registrar that shows that the applicant, i. has obtained a degree in social work from
    a social work program accredited by the Canadian Association for Social Work Education [...]
    iii. has a combination of academic qualifications and experience performing the role of a social
    worker that the Registrar determines is substantially equivalent to the qualifications required
    for a degree in social work from a social work program accredited by the Canadian Association
    for Social Work Education." — O. Reg. 383/00 (Registration), Social Work and Social Service Work
    Act, 1998 (consolidation period December 17, 2025; e-Laws currency date August 12, 2026)'
