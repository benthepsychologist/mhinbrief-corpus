  notes: 'THE SUBSTANTIAL-EQUIVALENCY ROUTE AT s. 7(1)1(iii) IS THE MOST PERMISSIVE ENTRY PATH TO
    ANY PROFESSION IN THIS CORPUS and should not be summarised away. Ontario admits a COMBINATION
    of academic qualifications and experience that the Registrar judges substantially equivalent
    to an accredited social work degree — meaning a person without a social work degree at all can
    hold a General certificate. Nova Scotia has no equivalent: NSCSW requires a CASWE-accredited
    BSW or MSW plus 2,500 practice hours. Quebec has no equivalent either: the permit opens only
    on a named diploma listed in RLRQ c. C-26, r. 2. ONTARIO REGULATES A SECOND, DIPLOMA-LEVEL PROFESSION
    UNDER THE SAME COLLEGE — SOCIAL SERVICE WORK (RSSW), with its own three classes and its own requirements
    at s. 8. Nothing like it exists in Nova Scotia or Quebec. This corpus does not track it as a
    profession (it has no value in the schema''s profession_scope enum) so it is noted here rather
    than enumerated as matrix cells — but a page describing ''who is regulated in Ontario'' that
    omits RSSWs is incomplete. NO SEPARATE CLINICAL TIER IN ONTARIO, and this is a three-way structural
    divergence worth a table of its own. Ontario: one General certificate, no clinical class — the
    ''clinical'' qualifier is a practice descriptor, not a registration category. Nova Scotia: a
    distinct CLINICAL SPECIALIST registration is REQUIRED before providing clinical social work in
    private practice. Quebec: no clinical tier either, but psychotherapy is separately gated by the
    Loi 21 permit from a different ordre. The corpus''s own profession_scope value ''clinical_social_worker''
    therefore maps onto a real registration class in only ONE of the three provinces. THE DISCLOSURE
    DUTY AT s. 5(2) IS CONTINUING ACROSS THE APPLICATION WINDOW — required both when the application
    is made AND when the certificate is issued, so a finding or proceeding arising in between must
    be volunteered. It also reaches findings by professional associations and other self-regulatory
    bodies, not only statutory colleges, and criminal findings in any jurisdiction. SOURCE RETRIEVAL
    NOTE: e-Laws is a React SPA rendered here with headless chromium; see ca-on-licensure-psychology''s
    note.'
