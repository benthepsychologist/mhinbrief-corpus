  clinician_facing_obligations: 'Hold a certificate of registration from the Ontario College of Social
    Workers and Social Service Workers (OCSWSSW). Three classes are prescribed for social work —
    General, Inactive, Retired — and three separately for SOCIAL SERVICE WORK, which is a distinct
    regulated profession under the same college (s. 1). GENERAL CERTIFICATE, SOCIAL WORK (s. 7(1))
    — the applicant must produce documentation satisfactory to the Registrar showing either: a degree
    in social work from a programme accredited by the Canadian Association for Social Work Education
    (CASWE), or a Canadian programme Council has approved as equivalent; or a degree from a social
    work or equivalent programme offered OUTSIDE Canada that Council has approved as equivalent to
    a CASWE-accredited programme; or a COMBINATION of academic qualifications and experience performing
    the role of a social worker that the Registrar determines is substantially equivalent to the
    qualifications required for a CASWE-accredited degree. The applicant must also have passed any
    social work examinations set or approved by Council. ALL CLASSES (s. 5(2)) additionally require:
    disclosure — at application and at issuance — of every finding of professional misconduct, incompetence
    or incapacity and every current such proceeding, in any jurisdiction and including findings by
    non-statutory professional bodies; disclosure of every finding of guilt for a criminal offence,
    an offence under the Controlled Drugs and Substances Act or the Food and Drugs Act, or any other
    offence relevant to suitability to practise; past and present conduct affording reasonable grounds
    to believe the applicant has no physical or mental condition affecting safe practice, will practise
    with decency, integrity and honesty and in accordance with the law, and has sufficient knowledge,
    skill and judgment; reasonable fluency in speaking and writing English or French; and Canadian
    citizenship, permanent residence, or authorization under the Immigration and Refugee Protection
    Act to practise. A General certificate holder must, whenever the College requires, provide evidence
    satisfactory to the College of continuing competence to practise (s. 9).'
