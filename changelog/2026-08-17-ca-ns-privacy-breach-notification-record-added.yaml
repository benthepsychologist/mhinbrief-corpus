  notes: 'THE s. 70(2) INVERSION IS THE MOST COUNTERINTUITIVE DUTY IN NOVA SCOTIA HEALTH PRIVACY
    AND THE ONE MOST LIKELY TO BE BREACHED WITHOUT ANYONE NOTICING. Deciding that a breach does NOT
    warrant telling the client does not close the file — it opens a mandatory report to the Review
    Officer instead. A custodian who quietly concludes ''no harm, no notice'' and files nothing has
    satisfied s. 69 and BREACHED s. 70(2). Any page describing NS breach obligations that omits this
    is worse than incomplete; it will lead a careful reader to the wrong action. State both branches
    together, always. THRESHOLD WORDING: ''potential for harm OR EMBARRASSMENT''. ''Embarrassment''
    is undefined in the Act and is a lower, more subjective bar than the risk-of-significant-harm
    test used in some other Canadian regimes. Do not paraphrase it as ''significant harm''. ''FIRST
    REASONABLE OPPORTUNITY'' is the timing standard — PHIA sets no fixed number of days, and the
    OIPC''s guidance (Key Steps to Responding to Privacy Breaches) is the practical reference, not
    a deadline in the statute. COMPARE ONTARIO (ca-on-privacy-breach-notification): PHIPA''s structure
    differs, and the ''decide not to notify -> tell the regulator'' inversion is a Nova Scotia feature.
    Do not carry a PHIPA summary across the provincial line.'
