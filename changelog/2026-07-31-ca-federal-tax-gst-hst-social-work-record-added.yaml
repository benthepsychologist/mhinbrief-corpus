  clinician_facing_obligations: 'Social work services are exempt from GST/HST, but
    under a materially narrower test than the psychotherapy and counselling therapy
    exemptions. Two conditions must both hold: the service is rendered within a professional-client
    relationship AND is provided for the prevention, assessment or remediation of
    — or to assist the individual in coping with — a physical, emotional, behavioural
    or mental disorder or disability. The disorder may be the client''s own or that
    of a related person the client cares for or supervises otherwise than professionally.
    Separately, the practitioner must be licensed where the province requires it,
    or hold equivalent qualifications where it does not. A social work service outside
    that clinical purpose test is not exempt under this provision.'
  vendor_facing_obligations: null
