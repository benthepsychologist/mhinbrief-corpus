  notes: 'WHY THIS IS ITS OWN RECORD AND NOT A FOOTNOTE: social work sits at s. 7.2,
    not in the s. 7 list, and its exemption is conditioned differently. s. 7 exempts
    a listed service rendered by a practitioner, full stop. s. 7.2 additionally requires
    a professional-client relationship AND a clinical purpose (disorder/disability).
    A social worker doing work outside that purpose is in a different position from
    a psychotherapist doing the equivalent, and collapsing the two would misstate
    the rule for a whole profession this registry serves.

    RELEVANT TO THE 2024 CHANGE, though this provision was untouched by it: CRA GST/HST
    Memorandum 25-3 states that where a social worker provides psychotherapy they
    are practising the profession of social work, so the s. 7.2 exemption may apply
    rather than the new s. 7(j.1). That means a social worker''s psychotherapy is
    tested against s. 7.2''s narrower conditions, not s. 7(j.1)''s. Worth stating
    plainly on any page covering this.

    Statutory text verified verbatim from raw Justice Laws HTML, no summarising tool
    in the extraction path. The source_quote is truncated at "...equivalent to those"
    — clause (b)(ii) continues; pull the remainder before quoting the equivalency
    limb in full on a page.

