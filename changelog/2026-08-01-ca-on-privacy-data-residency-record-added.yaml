  last_verified: '2026-07-31'
  source_quote: '"Any health information custodian to which the Personal Health Information
    Protection Act, 2004, S.O. 2004, c. 3, Schedule A, applies is exempt from the
    application of Part 1 of the Personal Information Protection and Electronic Documents
    Act in respect of the collection, use and disclosure of personal information that
    occurs within the Province of Ontario." — Health Information Custodians in the
    Province of Ontario Exemption Order, SOR/2005-399, P.C. 2005-2224, registered
    2005-11-28 (emphasis on the territorial scope is ours; the words ''within the
    Province of Ontario'' are the order''s own)'
