  clinician_facing_obligations: 'Using a US-hosted EHR, teletherapy platform, or cloud
    backup engages TWO regimes at once, and most practitioners know about neither.
    First, PHIPA s. 50(1) permits disclosure of PHI collected in Ontario to a person
    outside Ontario only on listed grounds — consent, statutory permission, reasonable
    necessity for the provision of health care, or payment/contractual administration.
    Ordinary EHR hosting is likely covered by the health-care-provision ground, but
    that is a ground the practitioner must be able to point to, not an automatic pass.
    Second, the federal order that exempts Ontario HICs from PIPEDA is scoped to activity
    ''within the Province of Ontario'' — so PIPEDA re-attaches the moment personal
    health information crosses a provincial or national border. The practical effect:
    a solo Ontario practitioner on a US-hosted platform may have to satisfy PHIPA
    s. 50 and PIPEDA simultaneously for that same transfer.'
