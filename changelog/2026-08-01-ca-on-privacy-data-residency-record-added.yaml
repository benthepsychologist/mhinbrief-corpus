  notes: 'HIGHEST-VALUE FINDING OF THIS PASS, and it is an inference from two verified
    primary texts rather than a statement either text makes on its own — flag that
    honestly on any page. The exemption order''s territorial scope is verbatim; PHIPA
    s. 50(1)''s conditions are verbatim; the CONCLUSION that PIPEDA re-attaches at
    the border is the reading that follows from the exemption being limited to activity
    ''within the Province of Ontario''. It is a strong reading, not a quoted holding.
    Consider legal review before this goes on a page — initiation §9 recommends attorney
    review for the highest-risk pages and names cross-border as one. UNVERIFIED, DO
    NOT CITE AS IPC TEXT: the IPC has published relevant guidance (''Thinking About
    Clouds?'', and a 2025 ''Privacy Management Handbook for Small Health Care Organizations''),
    but ipc.on.ca sits behind a full Cloudflare interstitial that defeats both plain
    fetch and the headless-browser tool. Titles confirmed via search; content NOT
    verified. An operator must fetch these by hand before any IPC language is quoted.'
