  notes: 'THE SINGLE MOST USEFUL CROSS-JURISDICTION FACT IN THIS CORPUS SITS HERE: THE SAME MASTER''S-LEVEL
    CLINICIAN HAS THREE DIFFERENT STATUSES IN THREE PROVINCES. In Ontario they are a PSYCHOLOGICAL
    ASSOCIATE — a distinct regulated title, not a psychologist. In Nova Scotia they can register
    as a PSYCHOLOGIST outright (NSRP''s baseline admits a master''s with four years of supervised
    experience). In Quebec they are NOT ELIGIBLE at all, because the permit has required a doctorate
    since 2006. A page that says ''psychologist'' without naming the province is describing three
    different qualifications. AND THE ONTARIO MASTER''S ROUTE IS THE HEAVIEST OF THE THREE ON EXPERIENCE,
    not the lightest: 6,000 hours over four years post-degree PLUS 1,500 supervised-practice hours,
    against the doctoral route''s 1,500 postdoctoral hours. The lower degree is offset by roughly
    five times the supervised experience. Do not describe the associate class as a ''lesser'' or
    ''easier'' route. BOTH ROUTES SIT THE SAME EXAMS — EPPP, oral, and Jurisprudence and Ethics.
    The difference is degree and hours, not assessment. BEHAVIOUR ANALYSTS ARE NOW IN THE SAME COLLEGE,
    and that is recent and easy to miss: the Psychology and Applied Behaviour Analysis Act, 2021
    replaced the old Psychology Act, 1991 and the College''s name changed accordingly. Any source
    still saying ''College of Psychologists of Ontario'' predates that. This corpus does not track
    behaviour analysts as a profession — they are not in the record schema''s profession_scope enum
    — so they are mentioned here as context and are NOT enumerated as matrix cells. ''AUTONOMOUS''
    vs ''SUPERVISED'' vs ''INTERIM AUTONOMOUS'' IS A PRACTICE AUTHORIZATION, NOT A SENIORITY LABEL.
    It travels with the certificate and determines whether the member may practise without supervision
    at all. Ontario is the only jurisdiction covered so far that builds its class list as a matrix
    of registrant type x authorization; Quebec uses permit categories, Nova Scotia uses practising/conditional
    licences. SOURCE RETRIEVAL NOTE, worth keeping for whoever verifies this next: Ontario e-Laws
    is a React SPA that returns an identical ~54KB shell to any plain fetch, its own /laws/docs/
    path returns S3 AccessDenied, and CanLII 403s. This text was read by rendering the page with
    local headless chromium (--dump-dom). Budget for that rather than assuming a fetch will work.'
