  source_quote: '"5. (1) Subject to subsections (2) to (6), to qualify for a certificate of registration
    for a psychologist authorizing autonomous practice, an applicant must comply with the following
    non-exemptible registration requirements: 1. The applicant must have obtained a doctoral degree,
    i. from a psychology program that is accredited by the Canadian Psychological Association or
    by another accrediting body that has been approved by Council for that purpose [...] 2. The applicant
    must have completed a minimum of 1,500 hours of postdoctoral supervised practice [...]" / "16.
    (1) [...] 1. The applicant must have obtained a master''s degree from a psychology program [...]
    2. Following the awarding of the degree described in paragraph 1, the applicant must have performed
    at least 6,000 hours of practice of the profession over at least four years [...]" — O. Reg.
    193/23 (Registration), Psychology and Applied Behaviour Analysis Act, 2021 (consolidation period
    July 1, 2024; e-Laws currency date August 12, 2026)'
