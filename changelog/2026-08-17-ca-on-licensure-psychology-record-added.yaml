  clinician_facing_obligations: 'Hold a certificate of registration from the College of Psychologists
    and Behaviour Analysts of Ontario (CPBAO). The regulation prescribes TWELVE classes (s. 1), built
    from three registrant types — psychologist, psychological associate, behaviour analyst — each
    crossed with a practice authorization (autonomous, interim autonomous, supervised; behaviour
    analysts have autonomous and supervised only), plus Academic, Inactive, Retired and a temporary
    emergency class. PSYCHOLOGIST, AUTONOMOUS PRACTICE (s. 5(1)) — non-exemptible requirements: a
    DOCTORAL degree from a psychology programme accredited by the Canadian Psychological Association
    (or one a Registration Committee panel considers equivalent, or a substantially similar programme
    outside Canada/the USA); a minimum of 1,500 hours of postdoctoral supervised practice performed
    while holding a supervised-practice certificate; the Examination for Professional Practice in
    Psychology (EPPP) administered by ASPPB or an approved alternative; an oral examination; the
    Jurisprudence and Ethics Examination; and any further training a panel considers necessary for
    competence in the intended area of practice. PSYCHOLOGICAL ASSOCIATE, AUTONOMOUS PRACTICE (s.
    16(1)) — a MASTER''S degree in psychology from a qualifying institution, where the programme
    required at least 576 hours of undergraduate psychology instruction for admission (including
    at least 36 hours in each of psychological assessment, psychological intervention, professional
    ethics and standards, research design/methodology/statistics, and the biological and social bases
    of behaviour); then at least 6,000 HOURS of practice over at least FOUR YEARS post-degree under
    the supervision of an autonomous-practice psychologist or psychological associate; plus at least
    1,500 hours performed while holding a psychological-associate supervised-practice certificate;
    plus the EPPP, the oral examination, and the Jurisprudence and Ethics Examination.'
