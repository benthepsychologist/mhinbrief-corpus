# Working manifest name per design §10 (engine/instance split).
kind: registry               # a corpus kestrel tends
name: therapybulletin
contract_version: 1          # engine refuses a major it doesn't speak
layout:
  schema: schema/record.yaml
  records: records/
  changelog: changelog/
  candidates: candidates/    # runner staging area — curation reads this
  buffer: buffer/            # cache semantics, 30-day, same as kestrel's
  snapshots: snapshots/      # page-diff prior-snapshot store (§3.4) — NOT
                             # buffer semantics: must outlive the sweep
                             # cadence, never retention-swept
  provenance: provenance/    # per-run fetch manifests, same shape
cadence:
  sweep: weekly               # the product rhythm ("cadence IS the product")
  verify: quarterly           # off-season re-verification pass
sources:
  # Extends the proven sources/sources.yaml per-source schema
  #   (name endpoint auth cadence recall perishability status notes)
  # with: tier · jurisdiction · method · collector · feed_url ·
  #        language · health
  - id: canada-gazette-p2
    name: Canada Gazette Part II
    tier: 1
    jurisdiction: ca-federal
    method: rss
    collector: rss
    feed_url: https://gazette.gc.ca/rss/p2-eng.xml
    cadence: biweekly
    perishability: durable
    status: wired
    health: {last_probe: 2026-07-30, verdict: live}
  - id: crpo-news
    name: CRPO news (Ontario psychotherapists)
    tier: 2
    jurisdiction: ca-on
    method: page-diff        # its RSS is 200-but-empty — demoted
    endpoint: https://crpo.ca/news/
    perishability: diffable
    status: wired
    health: {last_probe: 2026-07-30, verdict: feed-empty}
    # re-checked 2026-07-31 (Ontario source-map pass): /feed/ still resolves
    # 200 but is a genuinely empty RSS shell, zero <item> elements. page-diff
    # remains correct, no change needed — confirmation, not a new finding.

  # ---- proposed additions, 2026-07-31 source-map pass (4 parallel research
  # agents: federal, ca-on, ca-qc, ca-ns) — status: proposed is INERT, tend.py
  # only ever selects status: wired (tools/tend.py L147), so nothing here
  # gets collected until Ben flips a given entry to wired. Every entry below
  # was fetch-verified this session except where a note says otherwise —
  # never treat a note's caveat as resolved just because the entry exists.
  # cadence/health are intentionally left unset (no probe.py run against
  # these yet); set them when wiring.

