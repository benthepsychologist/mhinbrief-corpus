notes: 'CONFIDENCE IS MEDIUM BECAUSE THE PRIMARY STATUTE WAS NOT READ DIRECTLY IN THIS PASS. The
  2,500-hour figure and the RSW/Candidate split come from NSCSW''s own applicant-facing page, which
  is the College summarising its own rules — primary-adjacent, not primary. The Clinical Specialist
  requirement IS quoted from a primary instrument (the Code of Ethics and Standards of Practice,
  s. 5.5.2 and its footnote 23). To reach confidence: high, read Social Workers Act s. 22 and Social
  Worker Regulations s. 8 directly and re-quote. This is the weakest of the thirteen Nova Scotia
  drafts and should not be published ahead of the others. STATUTORY BASIS DIFFERS FROM THE OTHER
  TWO NS PROFESSIONS — this matters and is easy to get wrong right now: social work in Nova Scotia
  is STILL governed by the Social Workers Act, with a migration to the Regulated Health Professions
  Act (RHPA) publicly under way but NOT complete. The Code of Ethics and Standards of Practice effective
  2026-02-01 still cites the Social Workers Act throughout. Psychology, by contrast, COMPLETED its
  RHPA transition on 2025-11-24. Do not describe Nova Scotia as having moved mental-health professions
  to the RHPA as a block — one has, one has not, and counselling therapy sits under its own separate
  Counselling Therapists Act. THE CLINICAL-SPECIALIST GATE IS THE PRACTICALLY IMPORTANT PART for
  this corpus''s audience: an RSW alone cannot hold out as providing clinical social work in private
  practice. OPEN, RELATED, NOT RESOLVED HERE: NSCSW''s proposed duty-to-report standards under the
  RHPA (public comment closed 2026-08-30) are professional-conduct material that fits none of this
  corpus''s five core topics. That taxonomy gap is already flagged on this cell in coverage/matrix.yaml
  and remains open.'
