notes: 'TIER DISTINCTION THAT MUST NOT BE BLURRED: OCSWSSW''s ''the client''s location governs,
  not the registrant''s'' rule is real and consistently applied, but it lives on GUIDANCE/FAQ
  pages — it is NOT a numbered Standard of Practice. The 46-page Standards document was searched
  for ''jurisdiction'', ''cross-border'' and ''telepractice''; the only jurisdiction-governing
  rule in it is 5.3.1''s data-storage clause above. CPBAO 16 and CRPO 3.4.5 ARE standard-tier.
  Do not present all three as equally binding. STRUCTURAL ENFORCEMENT INSTEAD: OCSWSSW runs
  an ''Electronic Practice'' registration class for social workers registered elsewhere in
  Canada and living outside Ontario. Registrants who live in Ontario must hold general registration
  — electronic practice is explicitly not an option for them. So the client-location principle
  is enforced through registration category rather than a practice standard. STRONGEST DATA-RESIDENCY
  LANGUAGE of the three colleges (5.3.1''s storage-jurisdiction clause) — implicitly disfavours
  US hosting without banning it. CONFIRMED GAP, checked not merely unfound: no published OCSWSSW
  position on serving US clients. The Standards document and both relevant guidance pages
  address inter-provincial practice only.'
