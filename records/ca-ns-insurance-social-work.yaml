clinician_facing_obligations: Social workers IN PRIVATE PRACTICE must secure adequate malpractice,
  defamation, and liability insurance, and maintain registration with the Nova Scotia College of
  Social Workers. No minimum dollar amount is specified. Those providing clinical social work services
  in a private setting must also hold Clinical Specialist registration and provide evidence of that
  status (s. 5.5.2).
