notes: 'TWO LIMITS MAKE THIS THE WEAKEST INSURANCE REQUIREMENT OF THE THREE NOVA SCOTIA PROFESSIONS,
  and both are load-bearing. First, SCOPE: s. 5.5.1 sits under Guiding Principle 5.5, which is expressly
  about ''social workers in private practice''. On its face it does not reach employed social workers
  at all — unlike NS psychology (all registrants) and NS counselling therapy (all licensed registrants
  including those on leave). Second, AMOUNT: the standard says ''adequate'' and stops. There is no
  figure, no aggregate, no deductible rule, and no proof-of-coverage or renewal-verification requirement
  of the kind NSCCT and NSRP both impose. Compare NSRP''s $1,000,000 per occurrence and NSCCT''s
  $2,000,000 per claim / $5,000,000 aggregate with no deductible. ''DEFAMATION'' INSURANCE IS AN
  UNUSUAL NAMED INCLUSION — it appears in neither of the other two professions'' requirements and
  is worth calling out, since not every standard malpractice policy includes it. DO NOT STATE OR
  IMPLY A DOLLAR FIGURE FOR NS SOCIAL WORK. The absence of one is the finding. If a page needs a
  number, it must attribute it to an insurer or association product, never to the College. WORTH
  CHECKING BEFORE PUBLICATION: whether a bylaw, registration policy, or renewal form sets an amount
  that the Code does not. This pass found none, but absence of a figure in the Code is not proof
  none exists elsewhere in NSCSW''s instruments.'
