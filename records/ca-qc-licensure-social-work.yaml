  décernés par les établissements d''enseignement ci-après désignés: 1° le permis de travailleur
  social: a) Baccalauréat en service social (B.Serv.Soc.) de l''Université Laval; [...]" — Règlement
  sur les diplômes délivrés par les établissements d''enseignement désignés qui donnent droit aux
  permis et aux certificats de spécialistes des ordres professionnels, RLRQ c. C-26, r. 2, a. 1.15
  (à jour au 1er avril 2026)'
