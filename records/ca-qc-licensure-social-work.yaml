clinician_facing_obligations: Hold a permit from the Ordre des travailleurs sociaux et des thérapeutes
  conjugaux et familiaux du Québec (OTSTCFQ) and be entered on its roll to use the reserved title
  of travailleur social / social worker. The social worker permit opens on a Baccalauréat en service
  social or Baccalauréat en travail social from a designated Quebec university, or in some cases
  a Maîtrise en travail social, listed exhaustively at s. 1.15 of the diploma regulation. The same
  Ordre separately issues the thérapeute conjugal et familial permit under the same section. Holders
  of a related-field or out-of-province diploma proceed by equivalence. A social worker who wishes
  to practise psychotherapy must additionally hold the psychotherapist permit issued by the Ordre
  des psychologues du Québec — see ca-qc-scope-psychotherapy-permit-loi-21.
