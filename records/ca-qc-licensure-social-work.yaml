notes: 'ENTRY IS AT BACHELOR''S LEVEL, WHICH IS LOWER THAN QUEBEC PSYCHOLOGY''S DOCTORATE AND COMPARABLE
  TO THE OTHER PROVINCES'' SOCIAL WORK ROUTES — Nova Scotia requires a CASWE-accredited BSW or MSW
  plus 2,500 practice hours. Quebec''s diploma regulation sets no post-graduation hours requirement
  of that kind; the gate is the named diploma. NO SEPARATE ''CLINICAL'' REGISTRATION CLASS, and this
  is a real structural divergence from Nova Scotia. NSCSW requires a distinct Clinical Specialist
  registration before a social worker may provide clinical services in private practice. Quebec has
  no equivalent tier — the relevant additional gate in Quebec is the Loi 21 PSYCHOTHERAPIST PERMIT,
  which is a different thing entirely: it authorises a reserved ACT, is issued by a DIFFERENT ordre
  (the OPQ, not OTSTCFQ), and is not a class of social work registration. Do not map Quebec''s psychotherapist
  permit onto Nova Scotia''s Clinical Specialist status; they are not analogues. THE ORDRE COVERS
  TWO REGULATED TITLES under one roof — travailleur social and thérapeute conjugal et familial. The
  corpus''s profession_scope enum has ''mft'' available for the latter; this record is scoped to
  social work only and the MFT title is not enumerated as its own matrix cell yet.'
