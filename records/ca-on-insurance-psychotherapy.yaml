notes: 'TERRITORY: the by-laws were searched for ''territory'', ''outside Ontario'' and ''worldwide''
  — NO territory clause exists anywhere tied to the insurance requirement. WHAT PRACTITIONERS
  ACTUALLY BUY, and the split most won''t know to look for: the CCPA/BMS program states ''Coverage
  Territory: Canada; claims brought forward in Canada or US'' but separately ''E-Counselling
  Territory: Worldwide; claims brought forward and defended in Canada''. So a registrant delivering
  telehealth to a client physically outside Canada is covered on the SERVICE side, while claims
  handling stays Canada-anchored. That is a brochure, not policy wording. UNRESOLVED CONFLICT,
  flagged not resolved: the same brochure lists ''a deductible of no more than $4,000 per
  occurrence'' as satisfying CRPO requirements, which appears to contradict By-law 20.01(1)(iii)''s
  flat ''no deductible''. Could be a stale brochure, a broker misreading, or a nuance not
  visible in the excerpt. Do NOT assert either is wrong on a page without confirming with
  CCPA/BMS. OCCURRENCE vs CLAIMS-MADE: ''per occurrence'' here describes the LIMIT STRUCTURE,
  not a required policy form. Not established; do not assert.'
