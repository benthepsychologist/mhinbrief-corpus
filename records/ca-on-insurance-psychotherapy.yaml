clinician_facing_obligations: 'MANDATORY for all registrants except inactive registrants who
  have purchased run-off coverage. The policy must carry: at least $1,000,000 per occurrence;
  at least $5,000,000 annual aggregate; NO deductible; run-off coverage for a minimum of two
  years; an insurer licensed with FSRA Ontario or OSFI Canada; and a sexual abuse therapy
  and counselling fund endorsement covering persons eligible under s. 85.7(4) of the Code.'
