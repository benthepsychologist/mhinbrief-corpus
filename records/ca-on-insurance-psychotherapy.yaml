last_verified: '2026-07-31'
source_quote: '"(1) A Registrant, other than an Inactive Registrant who has purchased any
  run-off coverage contemplated by these by-laws, must carry professional liability insurance
  with the following characteristics: (i) a minimum of no less than $1,000,000 per occurrence;
  (ii) annual aggregate coverage of no less than $5,000,000; (iii) no deductible; (iv) run-off
  coverage for a minimum of two (2) years; (v) provided by an insurer licensed with the Financial
  Services Regulatory Authority of Ontario or the office of the Superintendent of Financial
  Institutions Canada..." — CRPO By-laws, s. 20.01 (made 2024-12-12, effective 2025-01-01,
  amended 2025-10-01)'
