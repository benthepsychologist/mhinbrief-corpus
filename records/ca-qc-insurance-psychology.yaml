notes: 'CONFIDENCE IS MEDIUM BECAUSE THE REGULATION ITSELF WAS NOT READ DIRECTLY. The amounts and
  the employer exemption are quoted verbatim from the OPQ''s own explanatory page — the regulator
  summarising its own regulation, which is primary-adjacent, not primary. The Règlement sur l''assurance
  de la responsabilité professionnelle des membres de l''Ordre des psychologues du Québec was not
  located on LégisQuébec in this pass under a confirmed RLRQ number. TO REACH HIGH: find the regulation''s
  RLRQ citation (it sits in the C-26 series) and quote the minimum-guarantee article directly, as
  was done for social work at ca-qc-insurance-social-work (RLRQ c. C-26, r. 283, a. 4). THE QUEBEC
  MODEL IS STRUCTURALLY DIFFERENT AND SHOULD NOT BE DESCRIBED AS ''BUY INSURANCE'': the obligation
  is to ADHERE TO THE ORDRE''S COLLECTIVE CONTRACT, not to source cover on the open market. The same
  design appears at OTSTCFQ. Compare Nova Scotia, where each registrant buys their own policy and
  NSCCT expressly refuses employer-provided cover. THE EMPLOYER EXEMPTION IS THE SHARPEST CONTRAST
  IN THE CORPUS ON THIS TOPIC. Quebec psychology exempts the employed clinician who proves employer
  cover. Nova Scotia counselling therapy does the exact opposite — employer policies are declared
  insufficient, full stop, and even registrants on leave must carry personal cover. Two provinces,
  opposite answers to the identical question. THE $1M/$3M FLOOR ALSO COVERS PSYCHOTHERAPIST-PERMIT
  HOLDERS WHO BELONG TO NO OTHER ORDRE — a population created by Loi 21''s transitional provisions;
  see ca-qc-scope-psychotherapy-permit-loi-21.'
