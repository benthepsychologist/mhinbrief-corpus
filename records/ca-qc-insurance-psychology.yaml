clinician_facing_obligations: Psychologists, and holders of a psychotherapist permit who are not
  admissible to another professional order, must adhere to the collective professional liability
  insurance contract concluded by the Ordre. The minimum guarantee is $1,000,000 per claim (par sinistre)
  and $3,000,000 per guarantee period (par période de garantie); coverage may be increased optionally
  to $2,000,000 per claim and $4,000,000 per period. The obligation does NOT apply where the psychologist
  or psychotherapist-permit holder holds insurance through their employer and furnishes proof of
  it.
