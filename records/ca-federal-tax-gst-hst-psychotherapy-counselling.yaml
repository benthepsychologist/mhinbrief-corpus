clinician_facing_obligations: >-
  Psychotherapy and counselling therapy services rendered to an individual by a
  "practitioner" of the service are exempt supplies — GST/HST is not charged on
  them. On becoming exempt, three consequences follow that practitioners
  routinely miss: input tax credits are no longer claimable on inputs acquired
  to make these supplies; a change in use of capital property may trigger a
  deemed sale and repurchase; and a registrant whose supplies are all exempt is
  not required to be registered and may close the GST/HST account.
