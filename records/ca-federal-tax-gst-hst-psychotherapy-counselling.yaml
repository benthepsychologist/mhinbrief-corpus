source_quote: >-
  "7 A supply of any of the following services if the service is rendered to an
  individual by a practitioner of the service: (a) optometric services; ...
  (j) psychological services; (j.1) psychotherapy services; (j.2) counselling
  therapy services; (k) midwifery services; (l) acupuncture services; and
  (m) naturopathic services." — Excise Tax Act, Schedule V, Part II, s. 7
  (Justice Laws consolidation, Act current to 2026-06-14)
