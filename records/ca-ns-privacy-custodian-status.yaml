notes: 'CONFIDENCE IS MEDIUM FOR ONE SPECIFIC, NAMEABLE REASON, and it is a genuinely open legal
  question rather than a gap in this pass''s reading. The custodian test runs through s. 3(1)(w),
  which requires registration ''under an Act of the Province SPECIFIC TO HIS OR HER PROFESSION''.
  That phrase fits counselling therapists (Counselling Therapists Act) and social workers (Social
  Workers Act) cleanly. It fits psychologists LESS cleanly since 2025-11-24, because psychology moved
  OFF its own profession-specific statute and ONTO the Regulated Health Professions Act — an umbrella
  Act covering many professions, with profession-specificity now carried by the Psychology Regulations
  made under it rather than by the Act. The plain reading almost certainly still captures psychologists
  (the RHPA is the vehicle by which they are registered, and PHIA elsewhere refers to the RHPA directly,
  e.g. s. 3(1)(f)(vii)), and no one appears to treat this as live. But the corpus should not assert
  custodian status for NS psychologists at confidence: high off a textual reading that the 2025 RHPA
  transition arguably disturbed. RESOLVE BY: checking whether PHIA or its regulations were consequentially
  amended by the RHPA transition, or whether psychologists are prescribed as a class under the tail
  of s. 3(1)(w). THE AGENT/CUSTODIAN SPLIT AT s. 6(2) IS THE PRACTICALLY IMPORTANT PART and the one
  clinicians get wrong. Employed at Nova Scotia Health or the IWK, you are an AGENT — the institution
  holds the custodian duties, and NSRP''s own PHIA guidance says exactly this. In private practice
  you ARE the custodian and every duty in the Act lands on you personally. s. 67(2) makes that concrete
  and is easy to miss: a solo practitioner who never appoints a contact person has not avoided the
  role — they have silently assumed it, including the duty to respond to access requests and receive
  complaints. ''AGENT'' REACHES FURTHER THAN EMPLOYEES — the definition expressly includes volunteers,
  the custodian''s insurer, and a lawyer retained by that insurer. CONTRAST ONTARIO (ca-on-privacy-custodian-status):
  PHIPA reaches the same destination by three different routes (RHPA membership, OCSWSSW named separately,
  a residual primary-function clause). Nova Scotia uses one route with two carve-outs. The shapes
  are not interchangeable and a page should not reuse Ontario''s explanation here.'
