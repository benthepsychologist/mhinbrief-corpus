notes: 'EASY TO MISS FOR A SOLO PRACTITIONER: PHIPA s. 17.1 (notice to the practitioner''s
  own College) is an EMPLOYER duty — it fires when a custodian''s employee or agent is disciplined
  or resigns over a privacy breach. A true solo practitioner with no employees or agents does
  not trigger it for their own conduct; it becomes live the moment they hire staff or engage
  an agent. OPEN: PHIPA s. 65 (damages for breach of privacy) was identified but not pulled
  verbatim this pass — add before any page discusses civil exposure.'
