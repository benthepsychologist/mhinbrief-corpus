notes: 'CORRECTED 2026-08-17, SAME DAY, AFTER THE OPERATOR CHALLENGED THE ORIGINAL READING. Keep
  this paragraph: it is the reason the record says what it now says. WHAT THE FIRST VERSION GOT WRONG.
  It asserted that the OPQ applies a ''location-of-the-professional'' JURISDICTIONAL TEST, presented
  that as one of ''three incompatible Canadian answers'', and built a cross-provincial comparison
  on it. That was an over-reading of a SCENARIO FAQ. The two sentences relied on are ANSWERS TO TWO
  SPECIFIC POSED QUESTIONS — an Ontario registrant temporarily in Montreal, and a BC registrant wanting
  to see a Montreal resident — not statements of doctrine. The first version also quoted the Montreal
  answer with an ellipsis that silently dropped two material clauses: ''ou à distance à des clients
  à l''extérieur du Québec'' (the rule also covers serving clients OUTSIDE Quebec) and ''ou obtenir
  une autorisation spéciale d''exercer'' (registration is not the only route). It also failed to
  record that home-jurisdiction licensure is RECOMMENDED, not required, in the BC answer. The full
  text of both Q&A pairs is now quoted verbatim above. THE OPERATOR''S OBJECTION, AND WHAT SURVIVES
  IT. The objection was that the original reading created an absurd hole — Quebec regulating by professional
  location and Ontario by client location would leave anyone anywhere free to treat Quebec clients.
  That reductio is sound against the original framing. It does not defeat the underlying sentence,
  which is real: the OPQ does say a psychologist or psychotherapist located outside Quebec MAY offer
  online services to clients in Quebec. Two things close the apparent hole, and both belong on any
  page built from this record. First, the FAQ''s subject throughout is a REGULATED TITLE-HOLDER —
  the questions are posed by an Ontario and a BC ''psychologue ou psychothérapeute'', and the answer''s
  subject is ''un psychologue ou un psychothérapeute situé à l''extérieur du territoire québécois''.
  It is not addressed to the general public. Second and decisively, this is web GUIDANCE ABOUT REGISTRATION
  and cannot repeal a statute: Code des professions art. 187.1 reserves the ACT of psychotherapy,
  and art. 187.4.3 makes the OPQ itself the prosecutor of illegal practice. The registration guidance
  and the reserved act answer different questions, and where they appear to conflict the statute
  governs. THE OPERATOR''S PROPOSED EXPLANATION WAS PARTLY RIGHT AND IS WORTH RECORDING PRECISELY.
  The suggestion was that the guidance concerns continuity of care for a client or clinician temporarily
  in Quebec. That is exactly right for the ''physically in Quebec'' answer — the question is literally
  an Ontario registrant in Montreal for a few months wanting to CONTINUE seeing existing Ontario
  clients, and the answer is STRICTER than the original record implied, because it captures a person
  whose entire caseload is outside Quebec. It is NOT right for the BC answer, which concerns a fresh
  service to a Quebec resident and involves no continuity and no temporary presence. Neither answer
  sits in the pandemic-era material, which is a separate section of the same site. STATUS OF THE
  INSTRUMENT, UNCHANGED AND STILL THE MAIN CAVEAT: this is undated web guidance, not a regulation,
  which is why confidence stays medium and regulatory_model stays ''none''. The claim that Quebec
  has no binding telepractice regulation for psychologists still rests on not having FOUND one in
  the C-26 series rather than on a provision saying so. DO NOT REBUILD THE ''THREE INCOMPATIBLE TESTS''
  COMPARISON on this record. Cross-border positions here differ in FORM as well as content — a college
  policy (NSCCT), enforceable standards (NSCSW, OTSTCFQ) and a scenario FAQ (OPQ) are not the same
  kind of thing and should not be tabulated as if they were competing statements of one doctrine.'
