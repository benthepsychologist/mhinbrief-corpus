clinician_facing_obligations: 'Quebec has no telepractice-specific REGULATION for psychologists.
  The OPQ publishes lignes directrices and points de repère, and is explicit that it does not impose
  particular tools or forms — ''l''Ordre ne prescrit, ne recommande, ni n''impose l''usage d''un
  formulaire préconçu''. The binding obligations are the ordinary ones — the Code de déontologie,
  the record-keeping regulation, competence — which apply whatever the medium. On INTERJURISDICTIONAL
  practice the OPQ does state operative positions: a psychologist serving a client located outside
  Quebec must check whether the regulator in the client''s jurisdiction requires a permit or legal
  authorisation there; and a person who is PHYSICALLY IN QUEBEC offering services to Quebec clients
  must register with the OPQ, while the OPQ accepts that psychologists located outside Quebec may
  offer online services to Quebec clientele. No data-hosting, platform, or server-location requirement
  is specified.'
