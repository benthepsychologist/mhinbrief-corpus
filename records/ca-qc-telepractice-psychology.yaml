notes: 'regulatory_model IS ''none'' FOR THE SAME REASON AS NOVA SCOTIA PSYCHOLOGY: the telepractice-specific
  material is guidance, and nothing in it restricts the clinician by its own force. Two of the four
  jurisdictions now covered leave psychology telepractice to guidance rather than rule. That is itself
  a publishable finding about the Canadian landscape, not a gap in the research. CONFIDENCE MEDIUM:
  the OPQ''s telepractice material is spread across several pages and is revised without visible
  version dates, and the quotes here come from the Ordre''s web guidance rather than an instrument
  with a citation. The claim ''there is no binding telepractice regulation in Quebec'' rests on not
  having found one in the C-26 regulation series, which is weaker evidence than reading a provision
  that says so. Re-check before publishing the negative as definitive. THE JURISDICTIONAL TEST IS
  LOCATION-OF-THE-PROFESSIONAL, AND IT NOW MAKES A THIRD INCOMPATIBLE CANADIAN ANSWER. The OPQ hinges
  registration on the professional being physically in Quebec, while accepting out-of-province psychologists
  serving Quebec clients online. NSCCT says practice occurs where the therapist is REGISTERED. NSCSW
  requires compliance with the law where the client RESIDES. Three regulators, three tests, one country
  — this belongs on any cross-border page as the headline, and no single rule should be stated as
  ''the Canadian position''. NOTE THE TENSION INSIDE THE OPQ''S OWN POSITION: it tells outbound psychologists
  to check the client''s jurisdiction for a permit requirement, while telling inbound out-of-province
  psychologists they need not register in Quebec. Those two stances are hard to hold together and
  the asymmetry should be described, not resolved, on a public page.'
