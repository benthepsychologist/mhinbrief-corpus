notes: 'INSTRUMENT TYPE — do not blur this on a page: the retention period is set by a COLLEGE
  STANDARD OF PRACTICE (college-enforceable), not by a statute or regulation. PHIPA is the
  only true statute in the stack here and it is silent on duration. CLOCK START: ''last interaction''
  — compare CPBAO (''last professional contact'') and OCSWSSW (''last entry''). OPEN / VERIFICATION
  DEBT: effective_date is null because the CRPO standard page carries NO visible revision
  or effective date. The rule text is verbatim-verified; its date is not. Do not assert on
  a page how long this has been the standard, or that it is current as of any date, without
  confirming with CRPO directly. PHIPA INTERACTION, and none of the three colleges'' own pages
  mention it: PHIPA sets NO retention period. s. 13(1) requires only that records be "retained,
  transferred and disposed of in a secure manner", and O. Reg. 329/04 adds no number either
  — the duration comes entirely from the college standard. But PHIPA s. 13(2) can EXTEND retention
  past the college clock: where records are subject to a s. 53 access request, the custodian
  must retain them "for as long as necessary to allow the individual to exhaust any recourse
  under this Act". A practitioner destroying at the 10-year mark while an access request is
  live would satisfy the college and breach the Act. Where no HIC successor is named, CRPO
  points at PHIPA s. 3(12): an estate trustee or administrator becomes responsible until custody
  passes on.'
