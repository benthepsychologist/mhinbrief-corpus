source_quote: '"Retention — Where the RP is the custodian of the clinical record, they retain
  the record for at least 10 years from the date of the last interaction with the client,
  or for 10 years from the client''s 18th birthday, whichever is later. For example, if a
  child is age seven at the time of last interaction, the record would be kept until the client''s
  28th birthday." — CRPO, Professional Practice Standards, Standard 5.1'
