clinician_facing_obligations: Where the registrant is custodian of the clinical record, retain
  it for at least 10 years from the date of the last interaction with the client, or 10 years
  from the client's 18th birthday — whichever is later. Registrants who are health information
  custodians must give the College up-to-date information about who would take custody of
  records on their death or long-term inability to act, and must maintain records securely
  for the Standard 5.1 period even after closing a practice, unless transferred to another
  custodian. Pre-planned closure or relocation generally requires at least 30 days' notice.
