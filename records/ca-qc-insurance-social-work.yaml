source_quote: '"1. Tout travailleur social qui exerce sa profession à temps plein, à temps partiel
  ou occasionnellement doit adhérer au contrat du régime collectif d''assurance de la responsabilité
  professionnelle conclu par l''Ordre professionnel des travailleurs sociaux et des thérapeutes conjugaux
  et familiaux du Québec [...]" ... "4. Le contrat d''assurance établissant un régime collectif d''assurance
  de la responsabilité professionnelle souscrit par l''Ordre doit prévoir les conditions minimales
  suivantes: 1° un montant de garantie d''au moins 500 000 $ par sinistre et de 1 000 000 $ pour
  l''ensemble des sinistres qui surviennent au cours de la période de garantie et pour lesquels une
  réclamation est présentée" — RLRQ c. C-26, r. 283, aa. 1 et 4 (à jour au 1er avril 2026)'
