notes: 'READ THE REGULATORY FLOOR AND THE ACTUAL CONTRACT AS TWO DIFFERENT NUMBERS AND NEVER CONFLATE
  THEM. a. 4(1°) sets what the Ordre''s collective contract must AT MINIMUM provide — $500,000 /
  $1,000,000. What members actually hold is whatever the current collective contract provides, presently
  around $2,000,000 / $2,000,000. A page quoting only the regulation understates real coverage; a
  page quoting only the brochure states a figure with no regulatory anchor that can change at the
  next renewal. State both, labelled. ''OCCASIONNELLEMENT'' IS LOAD-BEARING: the duty catches occasional
  practice, so a Quebec social worker doing a handful of private files alongside salaried employment
  is inside the obligation unless an exemption applies. THE EXEMPTION ROUTE IS THE OPPOSITE SHAPE
  FROM NOVA SCOTIA''S: Quebec allows an exemption where the employer formally stands as guarantor
  via a certificate filed with the Ordre — employer cover is recognised, but only through a documented
  undertaking meeting the a. 4 minimums. NSCCT in Nova Scotia refuses employer cover outright. NSCSW
  requires only ''adequate'' insurance with no amount at all and only for private practice. Three
  provinces'' social-work insurance rules that share almost nothing structurally. THE AGGREGATE IS
  ONLY DOUBLE THE PER-CLAIM FLOOR ($500k/$1M), a thin band by comparison with NSCCT''s $2M/$5M —
  worth noting for anyone assessing adequacy rather than compliance.'
