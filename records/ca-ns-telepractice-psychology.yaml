source_quote: '"As an Advisory these are not incorporated into NSRP''s Standards of Practice, but
  are provided as advice to Registrants regarding important issues to be carefully considered in
  offering telepsychology services." ... "As ACPRO Model Standards, they have no force unless and
  until they are adopted by the individual Canadian regulatory College or Board. At this time, NSRP
  has chosen to adopt the ACPRO Model Standards as advice to Registrants. These may be incorporated
  into the Standards of Practice in the future." — NSRP, Model Standards for Telepsychology Service
  (Advisory for Psychological Practice)'
