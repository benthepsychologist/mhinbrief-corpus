clinician_facing_obligations: There is NO binding, telepractice-specific standard for Nova Scotia
  psychologists. NSRP adopted ACPRO's Model Standards for Telepsychology Service as an ADVISORY only,
  expressly not incorporated into its Standards of Practice. As advice, registrants are directed
  to be licensed and in good standing in their home jurisdiction; to ensure they are legally entitled
  to deliver services outside it; to tell clients which regulator to complain to; to be familiar
  with the jurisprudence and standards where the service is received and follow the HIGHER standard
  where they conflict; to carry liability insurance covering out-of-jurisdiction service; to be competent
  in the technology; to use coded client identification where live visual verification is not possible;
  and to plan with clients for technology failure. NSRP's separate 'Use of Technology by Psychologists'
  guidance (revised June 2026, adding AI guidance and RHPA alignment) is likewise guidance, and states
  that it applies existing standards rather than creating new ones. The generally binding Standards
  of Practice — competence, consent, records, confidentiality — apply regardless of the medium of
  delivery, and that is where enforceable obligation actually sits.
