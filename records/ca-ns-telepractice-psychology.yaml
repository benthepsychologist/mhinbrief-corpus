notes: 'THIS IS A NEGATIVE FINDING AND IT IS THE POINT OF THE RECORD. Nova Scotia psychology has
  no enforceable telepractice standard — the document that looks like one says twice, in its own
  words, that it has no force. A page that lists these as ''Nova Scotia''s telepsychology requirements''
  would be materially misleading. regulatory_model is therefore ''none'' rather than ''clinician_restriction'':
  nothing here restricts the clinician by its own force. CONTRAST WITHIN NOVA SCOTIA: the other two
  professions DO have binding instruments. NSCCT has an enforceable Interjurisdictional Telecounselling
  policy (with a hard Canadian-server requirement); NSCSW has enforceable standards at Guiding Principle
  6.5 of a Code effective 2026-02-01. Psychology is the outlier, not the template. WATCH THIS CELL:
  NSRP itself says the Model Standards ''may be incorporated into the Standards of Practice in the
  future'', and the technology guidance was revised as recently as June 2026 for RHPA alignment.
  A future incorporation would flip this record from advisory to binding — that is exactly the kind
  of change /tend''s watch on ns-rp.ca exists to catch.'
