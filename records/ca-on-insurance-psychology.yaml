notes: '$2,000,000 is a SINGLE stated figure — the by-law does not split it into per-occurrence
  and aggregate the way CRPO''s does. Do not back-fill a split that isn''t in the text. OCCURRENCE
  vs CLAIMS-MADE: NOT ESTABLISHED. By-law 22 says nothing about policy form; do not assert
  an occurrence-basis requirement. TERRITORY: no explicit territory clause exists. 22.1''s
  ''in all settings in which the member practices'', read with 22.6''s exemption (which only
  exempts those residing outside Ontario AND serving no Ontario clients), implies coverage
  must follow cross-border practice — but that is an INFERENCE FROM STRUCTURE, not a stated
  rule, and the by-law never uses ''territory'' or ''worldwide''. WHAT PRACTITIONERS ACTUALLY
  BUY: the CPA/CPAP-BMS program states its policy ''applies to telepsychology services delivered
  in Canada and worldwide'', conditioned on working within scope and abiding by professional
  regulations in BOTH the practitioner''s and the client''s jurisdiction, and is written claims-made-and-reported
  with a 10-year extended reporting period. That FAQ is a coverage summary, explicitly not
  the policy wording — quote it as such.'
