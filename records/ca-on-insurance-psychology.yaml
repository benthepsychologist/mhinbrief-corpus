last_verified: '2026-07-31'
source_quote: '"22.1 Subject to Section 6, each member of the College registered with a certificate
  of registration authorizing autonomous practice, interim autonomous practice or supervised
  practice shall hold, or otherwise be covered by professional liability insurance in all
  settings in which the member practices. 22.2 The amount of insurance coverage shall be no
  less than $2,000,000. 22.3 The insurance shall have no deductible." — CPBAO By-laws, By-law
  22 (revised 2024-03-21, effective 2024-07-01)'
