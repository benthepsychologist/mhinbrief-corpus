clinician_facing_obligations: MANDATORY. Registrants holding a certificate authorising autonomous,
  interim autonomous or supervised practice must hold or be covered by professional liability
  insurance IN ALL SETTINGS IN WHICH THEY PRACTISE. Minimum coverage $2,000,000. No deductible
  is permitted. The only exemption is for a registrant who resides outside Ontario AND provides
  no services within Ontario at any time during the registration year, nor supervises anyone
  providing services in Ontario.
