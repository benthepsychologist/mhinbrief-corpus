source_quote: '"6. (1) Subject to section 7 and subsection 13 (2), the following are non-exemptible
  registration requirements for a Registered Psychotherapist certificate of registration: [...] 3.
  The applicant must have successfully completed clinical experience in psychotherapy that includes
  at least 450 hours of direct patient contact and at least 100 hours of clinical supervision where
  that clinical supervision relates to those hours of direct patient contact." ... "(3) No program
  may be approved under paragraph 1 of subsection (1) unless one of the core components of the program
  is designed to develop competency in the safe and effective use of self in a psychotherapeutic
  relationship." — O. Reg. 67/15 (Registration), Psychotherapy Act, 2007 (consolidation period May
  16, 2025; e-Laws currency date August 12, 2026)'
