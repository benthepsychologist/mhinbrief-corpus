clinician_facing_obligations: 'Hold a certificate of registration from the College of Registered
  Psychotherapists of Ontario (CRPO). Five classes are prescribed (s. 2): Registered Psychotherapist,
  Qualifying, Temporary, Inactive, and Emergency. Only a member holding the Registered Psychotherapist
  certificate may use the title ''Registered Psychotherapist'' or the abbreviation ''RP''; a Qualifying
  member may use only ''Registered Psychotherapist (Qualifying)'' / ''RP (Qualifying)'' (or the French
  ''Psychothérapeute autorisé (stagiaire)'' / ''PA (stagiaire)'') — abbreviating ''(Qualifying)''
  to ''(Q)'' is not acceptable. REGISTERED PSYCHOTHERAPIST (s. 6(1)) — non-exemptible requirements:
  successful completion of a psychotherapy programme approved by the Registration Committee, OR a
  master''s degree in an approved programme, OR a programme the Committee considers substantially
  equivalent, OR other education and training that together evidences substantially equivalent completion;
  the registration examinations; clinical experience in psychotherapy including AT LEAST 450 HOURS
  OF DIRECT PATIENT CONTACT and AT LEAST 100 HOURS OF CLINICAL SUPERVISION relating to those contact
  hours; and the jurisprudence course, completed no earlier than TWO YEARS before the application.
  CURRENCY (s. 6(2)): where the education or clinical-experience requirements were not completed
  within the one-year period immediately before applying, the applicant must additionally have completed
  at least 750 currency hours in the preceding three years, or upgrading activities approved by a
  Registration Committee panel. No programme may be approved unless one of its CORE COMPONENTS is
  designed to develop competency in the safe and effective use of self in a psychotherapeutic relationship
  (s. 6(3)).'
