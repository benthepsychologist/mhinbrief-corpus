notes: '''SAFE AND EFFECTIVE USE OF SELF'' IS A REAL, CITABLE REGULATORY REQUIREMENT IN ONTARIO —
  not a training-school slogan. s. 6(3) makes it a condition of programme APPROVAL, so it reaches
  every route into the profession. Nothing comparable appears in any other jurisdiction covered by
  this corpus, and it is the kind of detail worth quoting rather than paraphrasing. ONTARIO IS THE
  ONLY JURISDICTION HERE WITH A REGULATED ''PSYCHOTHERAPIST'' TITLE, and the three provinces answer
  ''who may do talk therapy'' with three structurally different instruments. Ontario: a distinct
  PROFESSION with its own Act and college (CRPO). Nova Scotia: a different profession under a different
  name — COUNSELLING THERAPIST, its own Act and college (NSCCT), with title protection rather than
  practice protection. Quebec: not a profession at all but a RESERVED ACT under Loi 21, with a permit
  issued by the psychologists'' ordre to members of seven other ordres. These are not translations
  of each other and an RP, an RCT and a Quebec psychotherapist-permit holder are not interchangeable.
  THE ENTRY BAR IS SPECIFIED IN HOURS OF CLIENT CONTACT, NOT DEGREE LEVEL — and that is unusual.
  A master''s degree is only one of four alternative education routes under s. 6(1)1; the hard floor
  everyone must clear is 450 direct-contact hours plus 100 hours of related clinical supervision.
  Compare CPBAO, where the degree is the gate and the hours follow from it. THE TWO-YEAR JURISPRUDENCE
  WINDOW AND THE 750-HOUR CURRENCY RULE ARE BOTH EASY TO TRIP OVER for a returning or slow-moving
  applicant; they are conditions on the application itself, not on practice. GRANDPARENTING IS CLOSED
  — CRPO''s own registration page records that the grandparenting route ended 2017-03-31. Any guidance
  still describing it is stale. SOURCE RETRIEVAL NOTE: e-Laws is a React SPA rendered here with headless
  chromium; see ca-on-licensure-psychology''s note. Also note that O. Reg. 317/12 under the same
  Act is PROFESSIONAL MISCONDUCT, not registration — an easy mis-citation.'
