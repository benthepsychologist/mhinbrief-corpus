clinician_facing_obligations: 'Hold a licence from the Nova Scotia Regulator of Psychology (NSRP)
  to practise psychology. Practising licence categories are set by s. 8 (psychologist practising
  licence, plus any further category established in the bylaws); conditional licences by s. 9 (candidate
  psychologist conditional licence, psychologist conditional licence, plus bylaw categories). Registration
  criteria under s. 10(2)(a) require graduation from an approved master''s, PhD or PsyD programme,
  passing the required examinations, English-language proficiency, Canadian citizenship or legal
  entitlement to work in Canada, and the capacity, competence and character to practise safely and
  ethically. Supervised-experience baseline per NSRP: two years post-doctoral, or four years at the
  master''s level.'
