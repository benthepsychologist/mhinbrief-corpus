notes: 'STRUCTURAL CHANGE, RECENT AND EASY TO MISS: as of 2025-11-24 psychology in Nova Scotia is
  regulated under the Regulated Health Professions Act (RHPA), and the regulator''s name changed
  from the Nova Scotia Board of Examiners in Psychology (NSBEP) to the Nova Scotia Regulator of Psychology
  (NSRP). Any source, directory, or insurer document still saying NSBEP is pre-November-2025. The
  regulator''s own site still serves pages under /about-nsbep/ paths and its contact email is still
  nsbep@nsbep.org, so the old name persisting on a page is NOT evidence the change didn''t happen.
  INSTRUMENT TYPE: this is a REGULATION made under a statute — binding, not a college guideline.
  Contrast the retention and telepractice records for this same profession, where the regulation
  is silent and the obligation lives in a college Standard or a mere advisory.'
