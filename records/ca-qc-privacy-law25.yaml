source_quote: '"3.5. [...] Si l''incident présente un risque qu''un préjudice sérieux soit causé,
  elle doit, avec diligence, aviser la Commission d''accès à l''information [...]. Elle doit également
  aviser toute personne dont un renseignement personnel est concerné par l''incident" ... "17. Avant
  de communiquer à l''extérieur du Québec un renseignement personnel, la personne qui exploite une
  entreprise doit procéder à une évaluation des facteurs relatifs à la vie privée. [...] Il en est
  de même lorsque la personne qui exploite une entreprise confie à une personne ou à un organisme
  à l''extérieur du Québec la tâche de recueillir, d''utiliser, de communiquer ou de conserver pour
  son compte un tel renseignement." — Loi sur la protection des renseignements personnels dans le
  secteur privé, RLRQ c. P-39.1 (à jour au 1er avril 2026)'
