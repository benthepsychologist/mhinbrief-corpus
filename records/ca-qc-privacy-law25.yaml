notes: 'ARTICLE 17 IS THE CLOSEST THING TO A DATA-RESIDENCY RULE IN THIS CORPUS, AND IT IS AN ASSESSMENT
  DUTY RATHER THAN A BAN. Quebec does not prohibit storing personal information outside the province
  — it requires a documented privacy impact assessment BEFORE doing so, and expressly extends that
  to merely ENTRUSTING an outside provider with KEEPING the information. In plain terms: a Quebec
  clinician in private practice who signs up for a US-hosted EHR or video platform owes an évaluation
  des facteurs relatifs à la vie privée before onboarding, not after. Contrast Nova Scotia, where
  neither PHIA nor its regulations say anything at all about where records may live (ca-ns-privacy-data-residency),
  and the only Canadian-server rule is one college''s policy. This is the single most practically
  divergent privacy obligation between the two provinces. THE STATUTE THAT APPLIES DEPENDS ON THE
  SETTING, AND GETTING THIS WRONG MISDIRECTS THE WHOLE ANALYSIS. P-39.1 governs personal information
  collected in the course of carrying on an ENTERPRISE (a. 1, referring to art. 1525 of the Civil
  Code) — that is the private practitioner. A clinician EMPLOYED in Quebec''s public health and social
  services network is not the enterprise; that setting is governed by the public-sector access and
  privacy regime and the health and social services legislation, which are NOT covered by this record.
  This is the same private/institutional fault line that s. 6(2) of Nova Scotia''s PHIA draws with
  its agent/custodian split, and that a. 12 of the Quebec psychologists'' records regulation draws
  by exempting établissement practice. NO STATUTORY RETENTION PERIOD HERE EITHER — a. 3.2 requires
  that the governance policy ADDRESS retention and destruction, not that it choose any particular
  period. The operative numbers remain the 5-year figures in the two professional records regulations.
  Same structural shape as PHIPA in Ontario and PHIA in Nova Scotia: the privacy statute mandates
  a schedule, the professional regulation supplies the number. THE PENALTY EXPOSURE IS AN ORDER OF
  MAGNITUDE ABOVE ANYTHING ELSE IN THE CORPUS and applies to natural persons, not only corporations:
  up to $100,000 in penal fines for an individual, and administrative penalties to $50,000. Failing
  to report an incident is named as an offence in its own right (a. 91(2°)). ''PRÉJUDICE SÉRIEUX''
  (serious injury) IS A HIGHER TRIGGER THAN NOVA SCOTIA''S ''harm or embarrassment''. And unlike
  PHIA s. 70(2), Law 25 imposes no duty to tell the regulator when you decide NOT to notify — instead
  it requires the incident register (a. 3.8), which the Commission may call for. Two different designs
  for the same problem; do not carry one province''s rule across the line.'
