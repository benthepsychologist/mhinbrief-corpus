notes: 'TITLE PROTECTION, NOT PRACTICE PROTECTION, IS WHAT THIS SECURES — the enforceable hook in
  NSCCT''s own materials is on the protected titles and on describing services as ''counselling therapy''.
  Do not render this as ''only RCTs may provide therapy in Nova Scotia''. NOVA SCOTIA IS ONE OF THE
  MINORITY OF PROVINCES THAT REGULATES THIS PROFESSION AT ALL — established 2011 under the Counselling
  Therapists Act. Per this corpus''s earlier source sweep, SK, MB and NL have no counselling-therapy
  regulator, and BC''s does not take effect until 2027-11-29. That contrast is worth surfacing on
  any national comparison page. THE REGULATION IS OLD RELATIVE TO THE COLLEGE''S LIVE POLICY SUITE:
  N.S. Reg. 287/2011 dates from 2011, while NSCCT''s registration and practice policies are revised
  continually (several carry 2025 and 2026 dates). Where the two could diverge — most importantly
  the insurance amount — the policy governs the operative number and the regulation only delegates
  it. See ca-ns-insurance-counselling-therapy.'
