clinician_facing_obligations: 'Hold a licence from the Nova Scotia College of Counselling Therapists
  (NSCCT) to use the protected titles ''Counselling Therapist'', ''Registered Counselling Therapist''
  / ''RCT'', or ''Registered Counselling Therapist - Candidate'' / ''RCT-C'', or to describe services
  as ''counselling therapy''. Licence categories under s. 5: active-practising; active-practising
  with conditions or restrictions; active-practising candidate; temporary; temporary with conditions
  or restrictions. Registration criteria (s. 6(2)) include a recognised counselling-therapy education
  programme, any registration examinations approved by the Board, no outstanding complaints in previous
  jurisdictions, English-language proficiency, an ethics course, workshop or exam, and a supervised
  practicum or internship with a minimum of 120 direct-contact practice hours. Entry to active-practising
  (s. 7(2)) additionally requires at least two years of supervised experience, and s. 8 sets that
  at a minimum of 2,000 hours including 50 direct-contact hours with a supervisor.'
