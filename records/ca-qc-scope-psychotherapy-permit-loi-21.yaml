notes: 'THIS CELL EXISTS BECAUSE QUEBEC DOES NOT FIT THE PROFESSION-BY-TOPIC GRID, AND FORCING IT
  IN WOULD MISREPRESENT THE LAW. Everywhere else in this corpus, ''who may do therapy'' is answered
  by naming a profession and its college. In Quebec the answer is an ACT reserved across professions:
  two professions hold it automatically, members of seven others may be authorised individually by
  permit, and the permit is issued and policed by an ordre (the OPQ) that is not their own. coverage/rubric.md
  anticipated this and gave it a sui-generis row rather than a profession cell. THE SEVEN-ORDRE LIST
  INCLUDES CRIMINOLOGUES AND SEXOLOGUES, which earlier project notes did not record — those notes
  named OTSTCFQ, OPPQ, OCCOQ, occupational therapists and nurses. The statutory list read directly
  is: conseillers d''orientation, criminologues, ergothérapeutes, infirmières et infirmiers, psychoéducateurs,
  sexologues, travailleurs sociaux et thérapeutes conjugaux et familiaux. Use the statute, not the
  summaries. PROFESSION_SCOPE IS A KNOWN COMPROMISE ON THIS RECORD. It is set to the two professions
  this corpus tracks in Quebec, but the reserved act reaches five further ordres whose titles have
  no value in the schema''s enum (criminologue, sexologue, ergothérapeute, infirmière, psychoéducateur).
  Per schema/record.yaml''s own instruction, the distinction is stated here rather than resolved
  by picking a wrong title. The related enum question for OCCOQ and OPPQ flagged in coverage/rubric.md
  remains open and is not closed by this record. THE DEFINITION IS THE OPERATIVE TEST AND IT IS NARROWER
  THAN ''TALK THERAPY''. Treatment must target a mental disorder, behavioural disturbance or problem
  causing psychological suffering, and aim at SIGNIFICANT CHANGE — the statute expressly excludes
  help with everyday difficulties and relationships of advice or support. The Office des professions
  maintains a regulated list of near-neighbour interventions that are NOT psychotherapy. Anyone reasoning
  about whether a given Quebec service needs the permit should be pointed at that list, not at the
  bare word ''therapy''. a. 187.2 IS A RARE THING: STATUTORY PRACTICE STANDARDS. Four requirements
  — structured interactional process, rigorous initial assessment, communication-based modalities,
  scientifically recognised models and validated methods — sit in the Code des professions itself
  and bind physicians and psychologists too, not only permit holders. No other jurisdiction in this
  corpus legislates method at this level. ENFORCEMENT IS CROSS-ORDRE AND UNUSUAL: a permit holder''s
  own order must add an OPQ member as expert to any inspection or investigation (a. 187.4), the OPQ
  must mirror suspensions imposed by the holder''s own order or the Tribunal des professions (a.
  187.4.2), and the OPQ alone prosecutes illegal practice (a. 187.4.3).'
