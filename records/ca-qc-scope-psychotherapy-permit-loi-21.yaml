source_quote: '"187.1. À l''exception du médecin et du psychologue, nul ne peut exercer la psychothérapie,
  ni utiliser le titre de psychothérapeute ni un titre ou une abréviation pouvant laisser croire
  qu''il l''est, s''il n''est membre de l''Ordre professionnel des conseillers et conseillères d''orientation
  du Québec, de l''Ordre professionnel des criminologues du Québec, de l''Ordre professionnel des
  ergothérapeutes du Québec, de l''Ordre professionnel des infirmières et infirmiers du Québec, de
  l''Ordre professionnel des psychoéducateurs et psychoéducatrices du Québec, de l''Ordre professionnel
  des sexologues du Québec ou de l''Ordre professionnel des travailleurs sociaux et des thérapeutes
  conjugaux et familiaux du Québec et s''il n''est titulaire du permis de psychothérapeute. La psychothérapie
  est un traitement psychologique pour un trouble mental, pour des perturbations comportementales
  ou pour tout autre problème entraînant une souffrance ou une détresse psychologique qui a pour
  but de favoriser chez le client des changements significatifs dans son fonctionnement cognitif,
  émotionnel ou comportemental, dans son système interpersonnel, dans sa personnalité ou dans son
  état de santé. Ce traitement va au-delà d''une aide visant à faire face aux difficultés courantes
  ou d''un rapport de conseils ou de soutien." — Code des professions, RLRQ c. C-26, a. 187.1 (à
  jour au 1er avril 2026)'
