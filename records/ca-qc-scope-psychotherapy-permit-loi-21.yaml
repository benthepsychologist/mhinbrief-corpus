clinician_facing_obligations: 'PSYCHOTHERAPY IN QUEBEC IS A RESERVED ACTIVITY, NOT A PROFESSION.
  Apart from physicians and psychologists — who hold it by virtue of their own permits — no one may
  practise psychotherapy, use the title psychothérapeute, or any title or abbreviation suggesting
  they are one, unless they are a member of one of seven named ordres AND hold the psychotherapist
  permit: conseillers et conseillères d''orientation, criminologues, ergothérapeutes, infirmières
  et infirmiers, psychoéducateurs et psychoéducatrices, sexologues, and travailleurs sociaux et thérapeutes
  conjugaux et familiaux (a. 187.1). Psychotherapy is defined in the statute as a psychological treatment
  for a mental disorder, behavioural disturbance or other problem causing psychological suffering
  or distress, aimed at significant change in the client''s cognitive, emotional or behavioural functioning,
  interpersonal system, personality or health — going beyond help in coping with everyday difficulties
  or a relationship of advice or support (a. 187.1 al. 2). The Office des professions establishes
  by regulation a list of interventions that resemble but do not constitute psychotherapy (a. 187.1
  al. 3). Anyone practising psychotherapy must, beyond the laws and regulations governing them: establish
  a structured interactional process with the client; conduct a rigorous initial assessment; apply
  therapeutic modalities based on communication; and rely on scientifically recognised theoretical
  models and validated intervention methods that respect human dignity (a. 187.2). The permit is
  applied for from the board of the Ordre des psychologues du Québec, with annual fees set by that
  board (a. 187.3). The Office des professions determines by regulation the conditions for using
  the title, the standards for issuing the permit, and the continuing-education framework (a. 187.3.1).
  A permit may be suspended or revoked by the OPQ board if the holder ceases to be a member of a
  professional order, fails to pay the annual fees, or fails to respect the title conditions or issuing
  standards (a. 187.4.1), and must be suspended or revoked where the holder''s own order or the Tribunal
  des professions has suspended or completely limited their right to practise psychotherapy (a. 187.4.2).
  Professional inspection or investigation of a permit holder by their own order must include an
  expert who is a member of the OPQ (a. 187.4).'
