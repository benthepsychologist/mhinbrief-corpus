notes: 'THE JURISDICTIONAL RULE HERE IS THE OPPOSITE OF THE COMMON ASSUMPTION and is the single most
  useful thing in this record. Most cross-border telepractice guidance in Canada tells clinicians
  that practice occurs where the CLIENT is located, which is why out-of-province registration questions
  arise. NSCCT expressly takes the other view — practice occurs where the THERAPIST is registered
  — and follows it through to the practical consequence: an out-of-province regulated therapist needs
  no NSCCT registration to see Nova Scotian clients. Do NOT generalise this to other provinces, and
  do not let it silently contradict the CCPA Standards of Practice (H7, Jurisdictional Issues), which
  NSCCT also adopts and which says the opposite — ''in some instances, counsellors/therapists will
  be required to register where the client is located''. That tension between two documents the same
  College relies on is a genuine, unresolved conflict and should be surfaced, not smoothed over.
  DATA RESIDENCY IS A HARD REQUIREMENT HERE, and it is the only explicit Canadian-server mandate
  found in Nova Scotia in this pass — PHIA itself contains no data-residency provision (see ca-ns-privacy-phia).
  A Nova Scotian counselling therapist using a US-hosted video or EHR platform is offside this policy
  even though the province''s privacy statute does not say so. COMPLAINTS MAY BE REFERRED OUT: the
  College may, at the Executive Director/Registrar''s discretion, refer a complaint involving service
  in another regulated province to that host jurisdiction, to avoid duplicate investigations.'
