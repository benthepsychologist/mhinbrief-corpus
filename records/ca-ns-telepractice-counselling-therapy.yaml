source_quote: '"The NSCCT maintains jurisdiction and regulatory oversight of all Registered Counselling
  Therapists (RCTs) and Registered Counselling Therapist-Candidates (RCTs) regardless of where (i.e.,
  physical location) or how (i.e., in-person or via telecounselling) they deliver counselling therapy.
  In the context of telecounselling, NSCCT interprets "service delivery" or "practice" as occurring
  in the jurisdiction where the counselling therapist is registered." ... "ensure that the platform
  used for telecounselling is PIPEDA compliant and that servers are located in Canada" — NSCCT, Interjurisdictional
  Telecounselling (Canada)'
