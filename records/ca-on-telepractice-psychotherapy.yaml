notes: 'THE NON-OBVIOUS ONE: CRPO does NOT require registration for a therapist residing outside
  Ontario to work with an Ontario client, provided they don''t advertise or promote services in Ontario
  and Ontario clients aren''t a substantial proportion of their workload — CRPO''s own words. That
  is materially more permissive than CPBAO, which requires registration for any individual physically
  in Ontario. CRPO also states no particular percentage of practice must be Ontario-based, and no
  notification is needed to take clients in other jurisdictions. US CLIENTS — CRPO has the clearest
  published position of the three colleges: a Sept 2024 webinar Q&A addresses PHIPA vs HIPAA and
  the USA PATRIOT Act directly, framing US-server storage as a documented risk assessment (''will
  depend on their practice circumstances and an assessment of the costs, risks, benefits, and alternatives''),
  NOT a prohibition. That Q&A is GUIDANCE, not a standard. The Cross-Border Therapy Tool is likewise
  a decision-tree advisory, self-disclaimed as not replacing legal advice. effective_date null: the
  standard page shows published/modified metadata but no approval or effective date. OPEN: CRPO''s
  Electronic Practice Guideline PDF returned unparseable binary and the Labour Mobility page (''4
