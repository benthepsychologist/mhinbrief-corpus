findings:
- CPBAO Standard 17.1 REQUIRES adherence to ACPRO's Model Standards for Telepsychology; NSRP adopted
  the SAME document as an advisory with no force. One document, two binding statuses.
- CRPO states verbatim that it does not require practitioners residing in another jurisdiction to
  register in order to work with an Ontario client. So the permissive inbound stance is a real documented
  Canadian pattern, not an artifact of the OPQ misreading — though CRPO attaches conditions (no advertising
  in Ontario, Ontario clients not a substantial share) that the OPQ FAQ does not state.
- 'CPBAO is the strict counterpart: registration required for anyone serving a person physically
  in Ontario, sourced to the College''s time-limited-registration page, not to the Standards.'
